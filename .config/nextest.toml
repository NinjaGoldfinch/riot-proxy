# cargo-nextest (CI-02, ADR-174). CI's `test` and `coverage` jobs run
# `--profile ci`; `cargo nextest run` locally uses the default profile.
# Each test runs in its own process, and the test binaries run in parallel.

[profile.ci]
# Report every failing test, not only the first binary's (`cargo test` stops there).
fail-fast = false
# No retries: a flaky test should fail CI, not pass on its second try.
retries = 0
# The slowest test takes about 10 s; a hang is killed after 3 min and named.
slow-timeout = { period = "60s", terminate-after = 3 }
# Failures print as they happen and again at the end.
failure-output = "immediate-final"
