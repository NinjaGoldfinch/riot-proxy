    <title>riot-proxy · dashboard</title>
    <!--
      The operator dashboard (design/13, ADM series). One self-contained file: no
      framework, no build step, nothing fetched from another origin. Everything it
      shows comes from /v1/admin/* JSON and the /v1/ws `metrics` + `firehose`
      topics, under one base URL (default: this page's origin).
    -->
    <style>
/* tokens:dark — design/13 §Visual tokens */
:root {
  --page: #0d0f13;
  --panel: #151920;
  --panel-2: #1b2029;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --border: rgba(255, 255, 255, 0.1);
  --accent: #3987e5;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --s6: #9085e9;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --focus: #58a6ff;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
/* tokens:light */
:root[data-theme='light'] {
  --page: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f0f1f4;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6b6a66;
  --grid: #e1e0d9;
  --border: rgba(11, 11, 11, 0.1);
  --accent: #2a78d6;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #4a3aa7;
  --good: #0b8a0b;
  --warning: #a86f00;
  --serious: #c2521b;
  --critical: #d03b3b;
  --focus: #2a78d6;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
  color-scheme: light;
}
/* end tokens */

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.num, table { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 14px; height: 14px; flex: none; vertical-align: -2px; fill: currentColor; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── layout A: rail + main (design/13 §Layout) ── */
.app { display: grid; grid-template-columns: 196px minmax(0, 1fr); align-content: start; min-height: calc(100vh - 34px); }
.rail { display: flex; flex-direction: column; gap: 12px; padding: 12px 8px; border-right: 1px solid var(--border); background: var(--panel); position: sticky; top: 34px; height: calc(100vh - 34px); overflow-y: auto; }
.tabs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.tab { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); cursor: pointer; text-align: left; white-space: nowrap; }
.tab:hover { background: var(--panel-2); color: var(--ink); }
.tab[aria-selected='true'] { background: var(--panel-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.tab .badge { margin-left: auto; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--panel); border: 1px solid var(--border); font-size: 11px; text-align: center; color: var(--ink-2); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 10px 6px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-2); }
.rail-foot .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.rail-foot code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { border-color: var(--critical); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: default; }
main { min-width: 0; padding: 0 20px 32px; }

/* ── health strip ── */
.strip { position: sticky; top: 34px; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 0; margin-bottom: 14px; background: var(--page); border-bottom: 1px solid var(--border); }
.pill { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--ink-2); }
.pill b { color: var(--ink); font-weight: 600; }
[data-level='good'] > svg.i { color: var(--good); }
[data-level='warning'] > svg.i { color: var(--warning); }
[data-level='serious'] > svg.i { color: var(--serious); }
[data-level='critical'] > svg.i { color: var(--critical); }
[data-level='unknown'] > svg.i { color: var(--muted); }
.strip .spacer { flex: 1; }
.strip .build { font-size: 12px; color: var(--muted); }

/* ── panels, tiles ── */
h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; color: var(--ink-2); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
.tile .value { font-size: 24px; font-weight: 600; line-height: 1.25; margin: 2px 0; font-variant-numeric: proportional-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }

/* ── charts (design/13 §Chart rules) ── */
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; margin-top: 10px; }
.chart { margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 8px; min-width: 0; }
.chart figcaption { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.chart figcaption b { font-weight: 600; font-size: 12px; color: var(--ink-2); }
.chart figcaption .latest { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.chart figcaption .btn { margin-left: 4px; }
.plotwrap { position: relative; height: 96px; margin-left: 0; outline-offset: 2px; touch-action: pan-y; }
.plotwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.plotwrap .grid { stroke: var(--grid); stroke-width: 1; }
.plotwrap .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plotwrap .wash { opacity: 0.1; stroke: none; }
.plotwrap .xh { stroke: var(--muted); stroke-width: 1; }
.plotwrap .ylab { position: absolute; left: 0; font-size: 11px; color: var(--muted); background: var(--panel); padding: 0 3px 0 0; line-height: 1; pointer-events: none; }
.plotwrap .ylab.top { top: 0; }
.plotwrap .ylab.bottom { bottom: 0; }
.readout { position: absolute; top: 0; padding: 2px 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); font-size: 11px; white-space: nowrap; pointer-events: none; transform: translateX(-50%); }
.xaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--ink-2); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 4px; }
.chart .tableview { margin-top: 6px; max-height: 220px; overflow: auto; }
.chart .nodata { height: 96px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 10px; margin-top: 10px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-bottom: 8px; }
.panel-head h2 { margin: 0; white-space: nowrap; }
.panel-head .end { margin-left: auto; font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12px; }
.filters input, .filters select { padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--page); min-width: 0; }
.filters input { flex: 1 1 160px; }
.filters .group { display: inline-flex; align-items: center; gap: 6px; }
.trunc { display: inline-block; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.stat5 { color: var(--ink); font-weight: 600; }
td .tag { display: inline-flex; align-items: center; gap: 4px; }

/* ── meters: used / limit as text, the fill carries severity ── */
.meter { display: grid; grid-template-columns: 12em minmax(40px, 1fr) minmax(8.5em, auto); align-items: center; gap: 8px; font-size: 12px; min-width: 0; }
.meter.bare { grid-template-columns: minmax(40px, 1fr) auto; }
.meter .ml { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter .track { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 16%, transparent); overflow: hidden; }
.meter .track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.meter .track i[data-level='warning'] { background: var(--warning); }
.meter .track i[data-level='critical'] { background: var(--critical); }
.meter .mt { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
.meter .mt [data-level] { display: inline-flex; vertical-align: -2px; }
.scopes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 10px; margin-top: 10px; }
.scope header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 8px; }
.scope header b { font-size: 14px; }
.scope .meters { display: flex; flex-direction: column; gap: 5px; }
.scope h3 { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 10px 0 5px; }
.scope details summary { cursor: pointer; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); }
.summary b { color: var(--ink); }
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 8px 0 0; font-size: 12px; }
dl.kv dt { color: var(--ink-2); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.form-row .btn { padding-top: 7px; padding-bottom: 7px; }
.form-row .field { flex: 1 1 140px; margin: 0; }

/* ── jobs ── */
.workers { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 6px; }
.worker { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; min-width: 0; }
.worker[data-job] { cursor: pointer; }
.worker[data-job]:hover { border-color: var(--accent); }
.worker .top { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.worker .top .el { margin-left: auto; color: var(--muted); white-space: nowrap; }
.worker .now { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.groups { list-style: none; margin: 0; padding: 0; font-size: 12px; }
ul.groups li { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) auto; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--grid); }
ul.groups li > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ul.groups .n { color: var(--ink); font-weight: 600; }
tr[data-job] { cursor: pointer; }
tr[data-job]:hover td { background: var(--panel-2); }
ol.timeline { list-style: none; margin: 0; padding: 0; font-size: 12px; max-height: 420px; overflow: auto; }
ol.timeline li { display: grid; grid-template-columns: 5.5em 3.5em minmax(0, 1fr) auto; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--grid); }
ol.timeline li .x { overflow-wrap: anywhere; }
ol.timeline li.ev-error .x { color: var(--ink); font-weight: 600; }
pre.payload { margin: 0; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }

/* ── ladder ── */
.crawl { margin-bottom: 10px; }
.crawl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 8px; }
.crawl-head .end { margin-left: auto; }
.stages { display: grid; grid-template-columns: auto auto minmax(60px, 1fr) minmax(0, auto); gap: 5px 10px; align-items: center; font-size: 12px; }
.stages .st { color: var(--ink-2); }
.stages .num { overflow-wrap: anywhere; }
.progress { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 16%, transparent); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.totals { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 0; font-size: 12px; color: var(--ink-2); }
.totals b { color: var(--ink); }
.capped { color: var(--ink); }
details.more { margin-top: 8px; font-size: 12px; }
details.more > summary { cursor: pointer; color: var(--ink-2); }
ul.groups.jl li { grid-template-columns: minmax(0, 1fr) auto auto; }
.activity h3 { font-size: 12px; margin: 10px 0 4px; color: var(--ink-2); font-weight: 600; }
.legs { display: flex; flex-wrap: wrap; gap: 4px; max-height: 120px; overflow: auto; }
.legs span { padding: 1px 6px; border: 1px solid var(--border); border-radius: 4px; white-space: nowrap; }
tr[data-run] { cursor: pointer; }
tr[data-run]:hover td, tr[data-run][aria-expanded='true'] td { background: var(--panel-2); }
details.panel > summary { cursor: pointer; }
details.panel > summary h2 { display: inline; }
@media (max-width: 1000px) { #ladderHistory .wide { display: none; } }
@media (max-width: 480px) { .stages { grid-template-columns: auto auto minmax(40px, 1fr); } .stages .num { grid-column: 1 / -1; } }

/* ── storage ── */
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--panel); margin: 6px 0; }
.stack i { display: block; min-width: 2px; }
.legend.stack-l { font-size: 12px; }
.note-line { display: flex; gap: 6px; align-items: center; margin: 6px 0; font-size: 12px; }
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ── consumers ── */
.newkey { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--warning); border-radius: 8px; }
.newkey code { display: block; margin: 6px 0; padding: 6px 8px; background: var(--page); border-radius: 4px; overflow-wrap: anywhere; user-select: all; }
.checks { display: flex; gap: 12px; align-items: center; font-size: 12px; }

/* ── table helper ── */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--focus); }
td.n, th.n { text-align: right; }
.more-rows { margin-top: 6px; font-size: 12px; color: var(--muted); }

/* ── sheets, confirm, toasts ── */
.scrim { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, 0.55); }
.sheet { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 18px; }
.sheet h2 { font-size: 15px; color: var(--ink); }
.sheet p { margin: 0 0 12px; color: var(--ink-2); }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 12px; color: var(--ink-2); }
.field input, .field select { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--page); }
.wraps { display: inline-block; white-space: normal; min-width: 14em; overflow-wrap: anywhere; }
.sheet .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.sheet .error { color: var(--ink); display: flex; gap: 6px; align-items: center; margin: 0 0 10px; }
.sheet .error svg { color: var(--critical); }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
.toast[data-level='good'] svg { color: var(--good); }
.toast[data-level='critical'] svg { color: var(--critical); }
.toast[data-level='warning'] svg { color: var(--warning); }

/* ── narrow: the rail becomes a tab strip above the content ── */
@media (max-width: 480px) { .meter { grid-template-columns: minmax(0, 9em) minmax(40px, 1fr) auto; } }
@media (max-width: 819px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: 34px; z-index: 60; height: auto; flex-direction: row; align-items: center; gap: 8px; padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--border); overflow: hidden; }
  .tabs { flex-direction: row; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: thin; }
  .tab { width: auto; }
  .tab[aria-selected='true'] { box-shadow: inset 0 -2px 0 var(--accent); }
  .rail-foot { margin: 0; padding: 0; border: 0; flex-direction: row; flex: none; }
  .rail-foot .wide { display: none; }
  #conn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .strip { position: static; }
  main { padding: 0 12px 24px; }
}

  return js.every((j) => jobWhen(j, now) === 'ready') ? 'ready' : jobWhen(js[0], now);

const STAGE_UNITS = { legs: 'legs', batches: 'batches of 25 players', ids: 'ids handed on' };
/** A crawl stage's numbers and pace (ADR-087): "50 / 80 batches of 25 players · 10 in 10m · ~30m 0s left". */
const stageText = (st) => {
  const nums = st.total == null ? (st.state === 'waiting' ? 'after the stage before' : '—') : `${st.done == null ? '?' : fmt(st.done)} / ${fmt(st.total)} ${STAGE_UNITS[st.unit] ?? st.unit}`;
  const pace = st.state !== 'now' ? '' : st.recent ? ` · ${fmt(st.recent)} in 10m${st.etaSeconds != null ? ` · ~${fmtDuration(st.etaSeconds)} left` : ''}` : ' · none finished in 10m';

};
const stagePct = (st) => (st.total ? Math.min(100, (100 * (st.done ?? 0)) / st.total) : st.state === 'done' ? 100 : 0);
/** An open leg of a crawl: a walk's page, an apex tier, a collect batch. */
const legName = (l) => {
  const p = l.leg.split(':');
  if (p[1] === 'walk') return `${p[2]} ${p[3]}${l.page ? ` · page ${l.page}` : ''}`;
  if (p[1] === 'apex') return p[2];
  if (p[1] === 'collect') return `players ${p[2]}+`;

};
const tierName = (t) => t.charAt(0) + t.slice(1).toLowerCase();
/** "Hide on bush#KR1" → { gameName, tagLine }; anything else is taken as a PUUID. */
const parsePlayer = (text) => {

const storageParts = (st) => {

// ── the sortable table helper, with a row cap ────────────────────────
/** columns: [{ key, label, num?, format?(value,row) }]; returns an element. */
function table({ columns, rows, cap = 200, sort = null, empty = 'Nothing here.' }) {
  const wrap = document.createElement('div');
  let by = sort ?? { key: null, dir: 'desc' };
  const draw = () => {
    const sorted = by.key ? sortRows(rows, by.key, by.dir) : rows;
    const { shown, more } = capRows(sorted, cap);
    const head = columns.map((c) => {
      const aria = by.key === c.key ? (by.dir === 'asc' ? 'ascending' : 'descending') : 'none';
      return `<th scope="col" class="${c.num ? 'n' : ''}" aria-sort="${aria}"><button type="button" data-sort="${esc(c.key)}">${esc(c.label)}${by.key === c.key ? (by.dir === 'asc' ? ' ▲' : ' ▼') : ''}</button></th>`;
    }).join('');
    const body = shown.length
      ? shown.map((r) => `<tr>${columns.map((c) => `<td class="${c.num ? 'n' : ''}">${c.format ? c.format(r[c.key], r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${columns.length}" class="muted">${esc(empty)}</td></tr>`;
    wrap.innerHTML = `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>` +
      (more ? `<div class="more-rows">showing ${fmt(shown.length)} of ${fmt(rows.length)}</div>` : '');
  };
  wrap.addEventListener('click', (e) => {
    const b = e.target.closest('[data-sort]');
    if (!b) return;
    const key = b.dataset.sort;
    by = { key, dir: by.key === key && by.dir === 'desc' ? 'asc' : 'desc' };
    draw();
  });
  draw();
  return wrap;
}

// ── the chart helper: SVG, one <path> per series (design/13 §Chart rules) ──
/**
 * series: [{ name, color, points: [[t, v|null]] }]; format(v) for labels.
 * A crosshair follows the pointer or the arrow keys; "Table" shows the numbers.
 */
function chart({ title, series, format = fmt, yMin = null, yMax = null, id = null }) {
  const fig = document.createElement('figure');
  fig.className = 'chart';
  if (id) fig.id = id;
  const pts = series.map((s) => ({ ...s, points: downsample(s.points, 600) }));
  const vals = pts.flatMap((s) => s.points.map((p) => p[1])).filter((v) => v != null);
  const times = pts[0]?.points.map((p) => p[0]) ?? [];
  // The latest value and the table use every point; the drawing, at most 600.
  const last = series.map((s) => [...s.points].reverse().find((p) => p[1] != null)?.[1] ?? null);
  const latest = pts.length === 1 ? (last[0] == null ? '—' : format(last[0])) : '';
  const head = `<figcaption><b>${esc(title)}</b><span class="latest">${esc(latest)}</span><button class="btn small" type="button" data-table aria-expanded="false">Table</button></figcaption>`;
  if (vals.length < 2 || times.length < 2) {
    fig.innerHTML = `${head}<div class="nodata">Not enough history yet.</div>`;
    fig.querySelector('[data-table]').remove();
    return fig;
  }
  const W = 600;
  const H = 96;
  let lo = yMin ?? Math.min(...vals);
  let hi = yMax ?? Math.max(...vals);
  if (hi === lo) { hi += Math.abs(hi) * 0.05 || 1; lo -= Math.abs(lo) * 0.05 || 0; }
  const t0 = times[0];
  const t1 = times[times.length - 1];
  const x = (t) => ((t - t0) / (t1 - t0 || 1)) * W;
  const y = (v) => H - ((v - lo) / (hi - lo)) * (H - 4) - 2;
  const segs = (points) => {
    const out = [];
    let cur = [];
    for (const [t, v] of points) {
      if (v == null) { if (cur.length) out.push(cur); cur = []; } else cur.push([x(t), y(v)]);
    }
    if (cur.length) out.push(cur);
    return out;
  };
  const paths = pts.map((s) => {
    const ss = segs(s.points);
    const line = ss.map((g) => g.map(([a, b], i) => `${i ? 'L' : 'M'}${a.toFixed(1)},${b.toFixed(1)}`).join('')).join('');
    const wash = pts.length === 1
      ? `<path class="wash" fill="${s.color}" d="${ss.map((g) => `M${g[0][0].toFixed(1)},${H}${g.map(([a, b]) => `L${a.toFixed(1)},${b.toFixed(1)}`).join('')}L${g[g.length - 1][0].toFixed(1)},${H}Z`).join('')}" />`
      : '';
    return `${wash}<path class="line" stroke="${s.color}" vector-effect="non-scaling-stroke" d="${line}" />`;
  }).join('');
  const grid = [2, H / 2, H - 2].map((g) => `<line class="grid" x1="0" x2="${W}" y1="${g}" y2="${g}" vector-effect="non-scaling-stroke" />`).join('');
  const ticks = [0, 1 / 3, 2 / 3, 1].map((f) => `<span>${hhmm(t0 + (t1 - t0) * f)}</span>`).join('');
  const legend = pts.length > 1 ? `<div class="legend">${pts.map((s, i) => `<span><i style="background:${s.color}"></i>${esc(s.name)} ${esc(last[i] == null ? '—' : format(last[i]))}</span>`).join('')}</div>` : '';
  const summary = `${title}: ${pts.map((s, i) => `${s.name} ${last[i] == null ? 'no data' : format(last[i])}`).join(', ')}; ${hhmm(t0)} to ${hhmm(t1)}. Arrow keys move the readout.`;
  fig.innerHTML = `${head}<div class="plotwrap" tabindex="0" role="img" aria-label="${esc(summary)}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${grid}${paths}<line class="xh" x1="0" x2="0" y1="0" y2="${H}" vector-effect="non-scaling-stroke" visibility="hidden" /></svg><span class="ylab top">${esc(format(hi))}</span><span class="ylab bottom">${esc(format(lo))}</span><span class="readout" hidden></span></div><div class="xaxis">${ticks}</div>${legend}<div class="tableview" hidden></div>`;
  const wrap = fig.querySelector('.plotwrap');
  const xh = fig.querySelector('.xh');
  const readout = fig.querySelector('.readout');
  let at = null;
  const show = (i) => {
    at = Math.max(0, Math.min(times.length - 1, i));
    const t = times[at];
    xh.setAttribute('x1', x(t));
    xh.setAttribute('x2', x(t));
    xh.setAttribute('visibility', 'visible');
    readout.hidden = false;
    readout.style.left = `${Math.min(88, Math.max(12, (x(t) / W) * 100))}%`;
    readout.textContent = `${hhmm(t)} · ${pts.map((s) => `${pts.length > 1 ? `${s.name} ` : ''}${s.points[at]?.[1] == null ? '—' : format(s.points[at][1])}`).join(' · ')}`;
  };
  const hide = () => { at = null; xh.setAttribute('visibility', 'hidden'); readout.hidden = true; };
  wrap.addEventListener('pointermove', (e) => {
    const r = wrap.getBoundingClientRect();
    if (!r.width) return;
    const t = t0 + ((e.clientX - r.left) / r.width) * (t1 - t0);
    let best = 0;
    for (let i = 1; i < times.length; i++) if (Math.abs(times[i] - t) < Math.abs(times[best] - t)) best = i;
    show(best);
  });
  wrap.addEventListener('pointerleave', hide);
  wrap.addEventListener('blur', hide);
  wrap.addEventListener('keydown', (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (step) { e.preventDefault(); show(at == null ? times.length - 1 : at + step); }
    else if (e.key === 'Home') { e.preventDefault(); show(0); }
    else if (e.key === 'End') { e.preventDefault(); show(times.length - 1); }
    else if (e.key === 'Escape') hide();
  });
  const btn = fig.querySelector('[data-table]');
  btn.addEventListener('click', () => {
    const box = fig.querySelector('.tableview');
    const open = box.hidden;
    box.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    if (open && !box.firstChild) {
      const rows = series[0].points.map(([t], i) => Object.fromEntries([['t', t], ...series.map((s, j) => [`s${j}`, s.points[i]?.[1] ?? null])]));
      box.append(table({
        columns: [{ key: 't', label: 'Time', format: (v) => esc(hhmm(v)) }, ...pts.map((s, j) => ({ key: `s${j}`, label: s.name, num: true, format: (v) => esc(v == null ? '—' : format(v)) }))],
        rows, cap: 200, sort: { key: 't', dir: 'desc' },
      }));
    }
  });
  return fig;
}

// ── the API: one base URL, the key from localStorage ─────────────────
class ApiError extends Error {
  constructor(status, body) {
    super(body?.error?.message || `HTTP ${status}`);
    this.status = status;
    this.body = body;
  }
}
async function api(path, { method = 'GET', body } = {}) {
  const headers = {};
  if (state.key) headers.Authorization = `Bearer ${state.key}`;
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const res = await fetch(joinUrl(state.base, path), {
    method, headers, cache: 'no-cache', body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { json = null; }
  if (res.status === 401 || res.status === 403) {
    openSheet(res.status === 403 ? 'This key has no admin scope.' : json?.error?.message || 'The key was refused.');
    throw new ApiError(res.status, json);
  }
  if (!res.ok) throw new ApiError(res.status, json);
  return json;
}

/** GET /metrics/history, once per entry of a tab that charts it. */
async function loadHistory() {
  try {
    const h = await api('/v1/admin/metrics/history');
    hist.points = h.points ?? [];
    hist.intervalMs = (h.intervalS ?? 60) * 1000;
    hist.loaded = true;
    // The stored history ends up to a minute ago; the newest snapshot is the live end.
    const s = store.get('snapshot');
    hist.live = s ? historyPointOf(s, Date.now()) : null;
    return true;
  } catch (e) {
    if (!(e instanceof ApiError)) console.warn(e);
    return false;
  }
}
async function enterOverview() {
  renderOverview();
  loadErrors();
  if (await loadHistory()) renderCharts();
}
store.on('snapshot', (s) => {
  const p = historyPointOf(s, Date.now());
  const prev = hist.points.at(-1);
  if (hist.loaded && (!prev || p.t - prev.t >= hist.intervalMs)) {
    hist.points.push(p);
    if (hist.points.length > 1440) hist.points.splice(0, hist.points.length - 1440);
    hist.live = null;
  } else hist.live = p;
  if (state.tab === 'limiter') renderLimiter();
  if (state.tab === 'cache') renderCache();
  updateBadges(s);
  if (state.tab !== 'overview') return;
  renderTiles();
  renderCharts();
  // New 4xx or 5xx answers since the last snapshot: the errors panel refreshes.
  const errs = Object.entries(s.requests ?? {}).filter(([k]) => /\|[45]\d\d\|/.test(k)).reduce((n, [, v]) => n + v, 0);
  if (errorCount != null && errs !== errorCount) loadErrors();
  errorCount = errs;
});
store.on('rates', () => { if (state.tab === 'overview') renderTiles(); });

function renderRecent() {
  if (!$('trRecent')) return;
  const q = traffic.text.trim().toLowerCase();
  const rows = traffic.recent.filter((r) =>
    (traffic.status === 'all' || statusClass(r.status) === traffic.status) &&
    (traffic.cache === 'all' || r.cache === traffic.cache) &&
    (!q || [r.path, r.route, r.consumer, r.requestId].some((f) => String(f ?? '').toLowerCase().includes(q))));
  $('trMeta').textContent = `${fmt(rows.length)} of the last ${fmt(traffic.recent.length)} · every 5 s`;
  $('trRecent').replaceChildren(table({
    columns: [
      { key: 'at', label: 'Time', format: (v) => esc(hhmmss(v)) },
      { key: 'status', label: 'Status', num: true, format: (v) => (v >= 500 ? `<span class="tag">${icon('critical')}${v}</span>` : v >= 400 ? `<span class="tag">${icon('warning')}${v}</span>` : esc(v)) },
      { key: 'method', label: 'Method' },
      { key: 'path', label: 'Path', format: (v, r) => `<code class="trunc" title="${esc(v)}&#10;${esc(r.route)}">${esc(v)}</code>` },

    ],
    rows, cap: 200, empty: traffic.recent.length ? 'Nothing matches the filter.' : 'No requests recorded yet.',

}
async function pollTraffic() {
  clearTimeout(traffic.timer);
  traffic.timer = null;
  if (state.tab !== 'traffic' || document.hidden || !state.started) return;
  try {
    const r = await api('/v1/admin/recent?kind=requests&limit=500');
    traffic.recent = r.requests ?? [];
    renderRoutes();
    renderRecent();
  } catch (e) {
    if (!(e instanceof ApiError)) console.warn(e);
  }
  if (state.tab === 'traffic' && !document.hidden && state.started) traffic.timer = setTimeout(pollTraffic, POLL_MS);
}
store.on('snapshot', () => { if (state.tab === 'traffic') renderRoutes(); });

// ── rail badges ──────────────────────────────────────────────────────
function badge(id, n, label) {
  const b = $(`badge-${id}`);
  if (!b) return;
  b.hidden = !n;
  b.textContent = n ? String(n) : '';
  if (n) b.setAttribute('aria-label', label); else b.removeAttribute('aria-label');
}
function updateBadges(s) {
  const frozen = (s.limiter ?? []).filter((x) => x.frozenMs > 0).length;
  badge('limiter', frozen, `${frozen} frozen`);
  const failed = jobTotals(s.queues).failed;
  badge('jobs', failed, `${failed} failed in 24 h`);
  const crawling = s.ladder?.running?.length ?? 0;
  badge('ladder', crawling, `${crawling} crawl${crawling === 1 ? '' : 's'} running`);
}

// ── countdowns: frozen scopes count down on the clock, not by refetching ──
function tickCountdowns() {
  for (const el of document.querySelectorAll('[data-until]')) {
    const left = Number(el.dataset.until) - Date.now();
    el.textContent = left > 0 ? fmtDuration(left / 1000) : 'now';
  }
}
const until = (ms) => `<span data-until="${(state.snapAt ?? Date.now()) + ms}">${esc(fmtDuration(ms / 1000))}</span>`;

// ── meters ───────────────────────────────────────────────────────────
function meter(label, used, limit, aria, show = fmt) {
  const f = limit ? Math.min(1, used / limit) : 0;
  const level = meterLevel(f);
  const mark = level === 'ok' ? '' : `<span data-level="${level}">${icon(level === 'critical' ? 'critical' : 'warning')}</span> `;
  return `<div class="meter${label ? '' : ' bare'}" role="meter" aria-label="${esc(aria ?? label)}" aria-valuemin="0" aria-valuemax="${limit}" aria-valuenow="${used}" aria-valuetext="${esc(show(used))} of ${esc(show(limit))}">` +
    `${label ? `<span class="ml">${esc(label)}</span>` : ''}<span class="track"><i data-level="${level}" style="width:${(f * 100).toFixed(1)}%"></i></span><span class="mt">${mark}${esc(show(used))} / ${esc(show(limit))}</span></div>`;
}

// ── Limiter ──────────────────────────────────────────────────────────
const lim = { open: new Set(), live: new Map() };
function renderLimiter() {
  if (state.tab !== 'limiter') return;
  const panel = $('panel-limiter');
  const s = store.get('snapshot');
  if (!s) { panel.innerHTML = '<h1>Limiter</h1><div class="empty">Waiting for the first snapshot…</div>'; return; }
  // Keep folds open across redraws.
  for (const d of panel.querySelectorAll('details[data-fold]')) {
    if (d.open) lim.open.add(d.dataset.fold); else lim.open.delete(d.dataset.fold);
  }
  const g = s.gates ?? {};
  const scopes = scopeOrder(s.limiter ?? [], g.blockedScopes);
  const heldFor = new Map((g.blockedScopes ?? []).map((b) => [b.scope, b.forMs]));
  const frozen = scopes.filter((x) => x.frozenMs > 0).length;
  const waiters = scopes.reduce((n, x) => n + (x.interactiveWaiters ?? 0), 0);
  const summary = `<div class="summary" id="limSummary"><span><b>${fmt(scopes.length)}</b> scopes</span><span><b>${fmt(frozen)}</b> frozen</span><span><b>${fmt(heldFor.size)}</b> holding bulk work</span><span><b>${fmt(waiters)}</b> interactive waiting</span>` +
    `<span>bulk ceiling <b>${pct(g.bulkUsageCeiling, 0)}</b>, <b>${pct(g.bulkIdleCeiling, 0)}</b> after ${fmt(g.bulkIdleAfterS)} s idle</span><span>client wait budget <b>${fmt(g.clientWaitBudgetMs)} ms</b></span></div>`;
  const cards = scopes.map((x) => {
    const methods = [...(x.methods ?? [])].sort((a, b) => fullness(b.windows) - fullness(a.windows));
    const blockedMethods = new Set((g.blockedMethods ?? []).filter((b) => b.scope === x.scope).map((b) => b.method));
    const mrow = (m) => `<div class="meters">${m.windows.map((w) => meter(`${m.method} · ${windowLabel(w.window)}`, w.used, w.limit, `${x.scope} ${m.method} ${windowLabel(w.window)}`)).join('')}${blockedMethods.has(m.method) ? `<div class="muted">${icon('warning')} bulk held on this method</div>` : ''}</div>`;
    const top = methods.slice(0, 4).map(mrow).join('');
    const rest = methods.slice(4);
    const state1 = x.frozenMs > 0
      ? `<span class="pill" data-level="serious">${icon('serious')}<span>frozen ${until(x.frozenMs)}</span></span>`
      : heldFor.has(x.scope)
        ? `<span class="pill" data-level="warning">${icon('warning')}<span>bulk held ${until(heldFor.get(x.scope))}</span></span>`
        : `<span class="pill" data-level="good">${icon('good')}<span>open</span></span>`;
    return `<article class="panel scope" data-scope="${esc(x.scope)}"><header><b>${esc(x.label)}</b><code>${esc(x.scope)}</code><span class="muted">${esc(x.kind)}</span>${state1}<span class="muted">${fmt(x.interactiveWaiters ?? 0)} waiting</span></header>
      <div class="meters">${(x.windows ?? []).length ? x.windows.map((w) => meter(`app · ${windowLabel(w.window)}`, w.used, w.limit, `${x.scope} app ${windowLabel(w.window)}`)).join('') : '<span class="muted">Riot has not named its app limits yet.</span>'}</div>
      ${methods.length ? `<h3>Methods, fullest first</h3>${top}` : ''}
      ${rest.length ? `<details data-fold="m:${esc(x.scope)}"${lim.open.has(`m:${x.scope}`) ? ' open' : ''}><summary>${rest.length} more method${rest.length === 1 ? '' : 's'}</summary>${rest.map(mrow).join('')}</details>` : ''}
      <details data-fold="l:${esc(x.scope)}" data-live="${esc(x.scope)}"${lim.open.has(`l:${x.scope}`) ? ' open' : ''}><summary>Live usage</summary><div class="live">${liveHtml(x.scope)}</div></details>
    </article>`;
  }).join('');
  panel.innerHTML = `<h1>Limiter</h1>${summary}<div class="scopes">${cards || '<div class="empty">No rate-limit scope has been used yet.</div>'}</div>`;
}
function liveHtml(scope) {
  const l = lim.live.get(scope);
  if (!l) return '<span class="muted">Open to read <code>/v1/admin/limits/' + esc(scope) + '</code>.</span>';
  if (l.error) return `<span class="muted">${esc(l.error)}</span>`;
  return `<div class="meters">${l.usage.map((w) => meter(`app · ${windowLabel(w.window)}`, w.used, w.limit)).join('') || '<span class="muted">No windows.</span>'}</div><div class="muted">read ${esc(hhmmss(l.at))}${l.frozenMs ? ` · frozen ${esc(fmtDuration(l.frozenMs / 1000))}` : ''}</div>`;
}
// "Live usage" reads /v1/admin/limits/{scope} each time it opens.
document.addEventListener('toggle', async (e) => {
  const d = e.target;
  if (!d.matches?.('details[data-live]') || !d.open) return;
  const scope = d.dataset.live;
  try {
    const l = await api(`/v1/admin/limits/${encodeURIComponent(scope)}`);
    lim.live.set(scope, { ...l, at: Date.now() });
  } catch (err) {
    lim.live.set(scope, { error: err.message, at: Date.now() });
  }
  const box = [...document.querySelectorAll('details[data-live]')].find((x) => x.dataset.live === scope)?.querySelector('.live');
  if (box) box.innerHTML = liveHtml(scope);
}, true);

    tile('Persisted rows', compact(c.l2Rows), 'the SQLite cache table, sampled'),

function renderCacheChart() {
  const box = $('cacheChart');
  if (!box || !hist.loaded) return;
  const v = seriesOf(hist.live ? [...hist.points, hist.live] : hist.points);
  box.replaceChildren(chart({ id: 'chCacheHit', title: 'Cache hit ratio · 24 h', series: [{ name: 'Hit ratio', color: 'var(--s3)', points: v.hit }], format: (n) => pct(n, 0), yMin: 0, yMax: 1 }));
}
async function probe(e) {
  e.preventDefault();
  const q = new URLSearchParams({ scope: $('probeScope').value.trim(), path: $('probePath').value.trim(), method: $('probeMethod').value.trim() });
  try {
    const r = await api(`/v1/admin/debug/cache?${q}`);
    $('probeResult').innerHTML = `<dl class="kv"><dt>key</dt><dd><code>${esc(r.key)}</code></dd><dt>cached</dt><dd>${r.present ? 'yes' : 'no'}</dd>` +
      (r.present ? `<dt>age</dt><dd>${esc(fmtDuration(r.ageSeconds))}</dd><dt>state</dt><dd>${r.stale ? 'stale: served as STALE and refreshed' : 'fresh'}</dd>` : '') + '</dl>';
  } catch (err) {
    $('probeResult').innerHTML = `<p class="muted">${icon('warning')} ${esc(err.message)}</p>`;
  }
}
function renderPurge() {
  const n = cachePurge.matched;
  $('purgeGo').disabled = !n;
  $('purgeGo').textContent = n ? `Purge ${fmt(n)} entr${n === 1 ? 'y' : 'ies'}` : 'Purge';
  $('purgeMeta').textContent = n == null ? 'Count the matches first; the purge asks before it deletes.' : `${fmt(n)} entr${n === 1 ? 'y matches' : 'ies match'} ${cachePurge.pattern}.`;
}
async function previewPurge(e) {
  e.preventDefault();
  const pattern = $('purgePattern').value.trim();
  try {
    const r = await api('/v1/admin/cache/purge', { method: 'POST', body: { pattern, dryRun: true } });
    cachePurge.pattern = pattern;
    cachePurge.matched = r.matched;
  } catch (err) {
    cachePurge.matched = null;
    toast(err.message, 'critical');
  }
  renderPurge();
}
async function purge() {
  const { pattern, matched } = cachePurge;
  if (!matched || pattern !== $('purgePattern').value.trim()) return;
  const yes = await confirmAction(`Delete ${fmt(matched)} cached entr${matched === 1 ? 'y' : 'ies'} matching ${pattern}? The next request for each fetches from Riot again.`, { title: 'Purge the cache', confirm: `Purge ${fmt(matched)}`, danger: true });
  if (!yes) return;
  try {
    const r = await api('/v1/admin/cache/purge', { method: 'POST', body: { pattern } });
    toast(`Purged ${fmt(r.deleted)} entr${r.deleted === 1 ? 'y' : 'ies'} matching ${pattern}.`);
  } catch (err) {
    toast(err.message, 'critical');
  }
  cachePurge.matched = null;
  renderPurge();
}

// ── Jobs (design/10 §Jobs page, folded in from /dev/jobs) ────────────
const J = { timer: null, tick: 0, live: true, id: null, trace: null, purge: null, kinds: [] };
const JOB_TICK_MS = 1000;
const jobRowCols = (extra) => [
  { key: 'kind', label: 'Kind', format: (v, j) => `<code>${esc(v)}</code><div class="muted">${esc(jobLabel(j))}</div>` },
  ...extra,
];
function enterJobs(id) {
  J.id = id;
  J.trace = id ? { next: 0, attempt: null, events: [], job: null, tr: null, missing: false } : null;
  J.tick = 0;
  renderJobs();
  stopJobs();
  jobsTick();
}
function stopJobs() { clearTimeout(J.timer); J.timer = null; }
async function jobsTick() {
  J.timer = null;
  if (state.tab !== 'jobs' || document.hidden || !state.started) return;
  const t = J.tick++;
  try {
    if (J.id) await pollTrace();
    else {
      const work = [api('/v1/admin/jobs/activity?limit=20').then(renderWorkers)];
      if (t % 5 === 0) work.push(api('/v1/admin/jobs/queue?limit=100').then(renderQueue), api('/v1/admin/jobs?state=failed&limit=50').then((r) => renderFailed(r.jobs)));
      if (t % 15 === 0) work.push(api('/v1/admin/jobs/stats').then(renderKinds));
      await Promise.all(work);
    }
  } catch (e) {
    if (!(e instanceof ApiError)) console.warn(e);
  }
  if (J.live && state.tab === 'jobs' && !document.hidden && state.started) J.timer = setTimeout(jobsTick, JOB_TICK_MS);
}

async function loadActivity(id) {

  }
  await Promise.all([loadConsumers(), loadPlayers(), L.opts ? null : api('/v1/admin/ladder/options').then((o) => { L.opts = o; }).catch(() => null)]);
  if (L.opts) $('plPlatforms').innerHTML = L.opts.platforms.map((p) => `<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('');
}
async function loadConsumers() {
  try { C.consumers = (await api('/v1/admin/consumers')).consumers ?? []; } catch (e) { if (!(e instanceof ApiError)) console.warn(e); return; }
  renderConsumers();
}
async function loadPlayers() {
  try { C.players = (await api('/v1/admin/tracked-players?tracked=true')).players ?? []; } catch (e) { if (!(e instanceof ApiError)) console.warn(e); return; }
  renderPlayers();
}
store.on('snapshot', () => { if (state.tab === 'consumers') { renderConsumers(); renderPlayers(); } });
function renderConsumers() {
  if (!$('cnList')) return;
  const quotas = new Map((store.get('snapshot')?.quotas ?? []).map((q) => [q.consumer, q]));
  const active = C.consumers.filter((c) => !c.disabledAt);
  $('cnMeta').textContent = `${fmt(active.length)} active · ${fmt(C.consumers.length - active.length)} revoked`;
  $('cnList').replaceChildren(table({
    columns: [
      { key: 'name', label: 'Name', format: (v, c) => `${esc(v)}<div class="muted"><code>${esc(c.id)}</code></div>` },
      { key: 'scopes', label: 'Scopes', format: (v) => esc((v ?? []).join(', ')) },
      { key: 'quotaPerMin', label: 'Quota use', format: (v, c) => { const q = quotas.get(c.id); return q ? meter('', q.used, q.limit, `${c.name} requests this minute`) : `<span class="muted">0 / ${fmt(v)} a minute</span>`; } },
      { key: 'createdAt', label: 'Created', format: (v) => esc(relTime(v)) },
      { key: 'disabledAt', label: 'State', format: (v, c) => (v ? `<span class="pill" data-level="unknown">${icon('unknown')}<span>revoked ${esc(relTime(v))}</span></span>` : `<button class="btn small danger" type="button" data-revoke="${esc(c.id)}" data-name="${esc(c.name)}">Revoke</button>`) },
    ],
    rows: [...active, ...C.consumers.filter((c) => c.disabledAt)], cap: 200, empty: 'No consumers.',
  }));
  $('cnRecheckId').innerHTML = active.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
}
function renderPlayers() {
  if (!$('plList')) return;
  $('plMeta').textContent = `${fmt(C.players.length)} tracked of ${fmt(store.get('snapshot')?.totals?.knownPlayers)} known`;
  $('plList').replaceChildren(table({
    columns: [
      { key: 'gameName', label: 'Player', format: (v, p) => (v ? `${esc(v)}<span class="muted">#${esc(p.tagLine ?? '')}</span>` : `<code>${esc(p.puuid.slice(0, 12))}…</code>`) },
      { key: 'platform', label: 'Platform' },
      { key: 'lastSeenMatchId', label: 'Last match', format: (v) => (v ? `<code>${esc(v)}</code>` : '—') },
      { key: 'historyBackfilledAt', label: 'History', format: (v, p) => esc(v ? `walked ${relTime(v)}` : p.historyBackfillStartedAt ? 'walking' : 'not walked') },
      { key: 'puuid', label: '', format: (v, p) => `<button class="btn small" type="button" data-untrack="${esc(v)}" data-name="${esc(p.gameName ?? v.slice(0, 12))}">Untrack</button>` },
    ],
    rows: C.players, cap: 200, empty: 'No tracked players.',
  }));
}
async function createConsumer(e) {
  e.preventDefault();
  const body = { name: $('cnName').value.trim(), scopes: [['read', $('cnRead').checked], ['admin', $('cnAdmin').checked]].filter(([, on]) => on).map(([k]) => k), quotaPerMin: Number($('cnQuota').value) || 600 };
  if (!(await confirmAction(`Create ${body.name} with ${body.scopes.join(' and ') || 'no'} scope${body.scopes.length === 1 ? '' : 's'} and ${fmt(body.quotaPerMin)} requests a minute? Its key is shown once.`, { title: 'Create a consumer', confirm: 'Create' }))) return;
  try {
    const r = await api('/v1/admin/consumers', { method: 'POST', body });
    // The key is shown here once and kept nowhere else: not in the store, a toast or localStorage.
    $('cnKey').innerHTML = `<div class="newkey" role="alert"><b>${icon('warning')} The key for ${esc(r.name)}</b><p class="muted">${esc(r.warning)}</p><code id="cnKeyText">${esc(r.key)}</code><button class="btn small" type="button" id="cnCopy">Copy</button> <button class="btn small" type="button" id="cnDone">Done</button></div>`;
    $('cnCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('cnKeyText').textContent); toast('Copied.'); } catch { toast('Copy it by hand: the clipboard is not available here.', 'warning'); } });
    $('cnDone').addEventListener('click', () => { $('cnKey').innerHTML = ''; });
    $('cnName').value = '';
    loadConsumers();
  } catch (err) {
    toast(err.message, 'critical');
  }
}
async function revokeConsumer(id, name) {
  if (!(await confirmAction(`Revoke ${name}? Its key stops working at once; the row is kept.`, { title: 'Revoke a consumer', confirm: 'Revoke', danger: true }))) return;
  try {
    await api(`/v1/admin/consumers/${encodeURIComponent(id)}`, { method: 'DELETE' });
    toast(`${name} revoked.`);
  } catch (err) {
    if (!(err instanceof ApiError && (err.status === 401 || err.status === 403))) toast(err.message, 'critical');
    return;
  }
  // If that was this page's own key, the next call is refused and the key sheet opens.
  loadConsumers();
}
async function sha256Hex(text) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
async function recheckKey(e) {
  e.preventDefault();
  const id = $('cnRecheckId').value;
  const raw = $('cnRecheckKey').value.trim();
  try {
    // The key is hashed here; only its hash is sent.
    const keyHash = isHash(raw) ? raw.toLowerCase() : await sha256Hex(raw);
    $('cnRecheckKey').value = '';
    if (!(await confirmAction('Drop this key from the auth cache? Its next request is checked against the database.', { title: 'Re-check a key', confirm: 'Re-check' }))) return;
    const r = await api(`/v1/admin/consumers/${encodeURIComponent(id)}/revoke-cache`, { method: 'POST', body: { keyHash } });
    toast(r.stillActive ? 'Dropped from the cache; the key is still active.' : 'Dropped from the cache; the key is revoked.');
  } catch (err) {
    toast(err.message, 'critical');
  }
}
async function trackPlayer(e) {
  e.preventDefault();
  const body = { platform: $('plPlatform').value.trim(), ...parsePlayer($('plWho').value) };
  const who = body.gameName ? `${body.gameName}#${body.tagLine}` : `${String(body.puuid).slice(0, 12)}…`;
  if (!(await confirmAction(`Track ${who} on ${body.platform}? It is polled for live games, rank and new matches, and its history is walked once.`, { title: 'Track a player', confirm: 'Track' }))) return;
  try {
    await api('/v1/admin/tracked-players', { method: 'POST', body });
    toast(`Tracking ${who}.`);
    $('plWho').value = '';
    loadPlayers();
  } catch (err) {
    toast(err.message, 'critical');
  }
}
async function untrackPlayer(puuid, name) {
  if (!(await confirmAction(`Stop tracking ${name}? The row and its history stay.`, { title: 'Untrack a player', confirm: 'Untrack' }))) return;
  try {
    await api(`/v1/admin/tracked-players/${encodeURIComponent(puuid)}`, { method: 'DELETE' });
    toast(`${name} is no longer tracked.`);
    loadPlayers();
  } catch (err) {
    toast(err.message, 'critical');
  }
}

// ── health strip and the rail's foot ─────────────────────────────────
function renderStrip() {
  const s = store.get('snapshot');
  const ready = store.get('ready');
  const info = store.get('info');
  if (ready) pill($('sReady'), ready.ok ? 'good' : 'critical', ready.ok ? 'ready' : 'not ready');
  const lim = limiterLevel(s);
  pill($('sLimiter'), lim.level, esc(lim.text));
  const disk = diskLevel(s?.disk);
  pill($('sDisk'), disk.level, disk.used == null ? 'disk —' : `disk ${pct(disk.used, 0)} · ${esc(fmtBytes(s.disk.freeBytes))} free`);
  const b = backupLevel(store.get('backups'));
  pill($('sBackup'), b.level, esc(b.text));
  $('sScope').innerHTML = `<span>scope <b>${esc((s?.keyScope ?? info?.keyScope ?? '—').slice(0, 8))}</b></span>`;
  if (info) {
    const up = (Date.now() - info.startedAt) / 1000;
    $('sBuild').textContent = `v${info.version} · ${info.gitSha.slice(0, 7)} · ${info.env} · up ${fmtDuration(up)}`;
  }
}
for (const k of ['snapshot', 'ready', 'info', 'backups']) store.on(k, renderStrip);
function setConn(level, text) {
  pill($('conn'), level, esc(text));
}
function renderFoot() {
  $('baseLabel').textContent = state.base.replace(/^https?:\/\//, '');
  $('baseLabel').title = state.base;
  $('keyLabel').textContent = maskKey(state.key);
}

// ── snapshots: from the API on entry, then from the metrics topic ────
function takeSnapshot(s) {
  const at = Date.now();
  const cur = { at, requests: sumValues(s.requests), upstream: sumValues(s.upstream) };
  const p = state.prev;
  state.prev = cur;
  state.snapAt = at;
  if (state.firstArchived == null) state.firstArchived = s.totals?.archivedMatches ?? null;
  store.set('rates', {
    requests: rate(p && { at: p.at, total: p.requests }, { at, total: cur.requests }),
    upstream: rate(p && { at: p.at, total: p.upstream }, { at, total: cur.upstream }),
    requestsTotal: cur.requests,
    upstreamTotal: cur.upstream,
  });
  store.set('snapshot', s);
}
async function refresh() {
  const jobs = [
    api('/v1/admin/metrics').then(takeSnapshot),
    fetch(joinUrl(state.base, '/readyz'), { cache: 'no-cache' }).then((r) => r.json()).then((j) => store.set('ready', j)),
    api('/v1/admin/backups').then((b) => store.set('backups', b)),
  ];
  const results = await Promise.allSettled(jobs);
  for (const r of results) if (r.status === 'rejected' && !(r.reason instanceof ApiError && r.reason.status < 500 && r.reason.status >= 400)) console.warn(r.reason);
}

// ── the socket: metrics + firehose, metrics dropped while hidden ─────
function send(frame) {
  if (state.ws?.readyState === 1) state.ws.send(JSON.stringify(frame));
}
function connect() {
  clearTimeout(state.retry);
  const ws = new WebSocket(wsUrl(state.base, state.key));
  state.ws = ws;
  setConn('unknown', 'connecting…');
  ws.onopen = () => {
    state.backoff = 1000;
    send({ op: 'subscribe', topics: document.hidden ? ['firehose'] : ['metrics', 'firehose'] });
    setConn(document.hidden ? 'warning' : 'good', document.hidden ? 'paused' : 'live');
  };
  ws.onmessage = (e) => {
    let frame;
    try { frame = JSON.parse(e.data); } catch { return; }
    if (frame.op === 'error' && ['UNAUTHORIZED', 'FORBIDDEN'].includes(frame.error?.code)) {
      openSheet(frame.error.message || 'The key was refused.');
      return;
    }
    if (frame.op !== 'event') return;
    if (frame.event === 'metrics.snapshot') takeSnapshot(frame.data);
    store.set('event', frame);
  };
  ws.onclose = (e) => {
    if (state.ws !== ws) return;
    state.ws = null;
    if (e?.code === 4401 || e?.code === 4403) {
      setConn('critical', 'key refused');
      openSheet(e.reason || 'The key was refused.');
      return;
    }
    const wait = state.backoff;
    state.backoff = Math.min(state.backoff * 2, 30000);
    setConn('warning', `reconnecting in ${Math.round(wait / 1000)}s`);
    state.retry = setTimeout(connect, wait);
  };
}
function disconnect() {
  clearTimeout(state.retry);
  const ws = state.ws;
  state.ws = null;
  ws?.close();
}
document.addEventListener('visibilitychange', () => {
  if (!state.started) return;
  if (document.hidden) {
    send({ op: 'unsubscribe', topics: ['metrics'] });
    if (state.ws) setConn('warning', 'paused');
    TABS.find((t) => t.id === state.tab)?.leave?.();
  } else {
    send({ op: 'subscribe', topics: ['metrics'] });
    if (state.ws?.readyState === 1) setConn('good', 'live');
    refresh();
    TABS.find((t) => t.id === state.tab)?.enter?.(route(location.hash).id);
  }
});

// ── the key sheet: the probe is GET /v1/admin/info ───────────────────
function openSheet(message) {
  state.started = false;
  disconnect();
  const err = $('sheetError');
  err.hidden = !message;
  err.querySelector('span').textContent = message ?? '';
  $('keyInput').value = '';
  $('baseInput').value = state.base;
  $('sheet').hidden = false;
  $('keyInput').focus();
}
$('sheetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const key = $('keyInput').value.trim();
  const base = ($('baseInput').value.trim() || location.origin).replace(/\/+$/, '');
  state.key = key;
  state.base = base;
  if (base === location.origin) localStorage.removeItem(STORE_BASE);
  else localStorage.setItem(STORE_BASE, base);
  $('sheet').hidden = true;
  await boot();
});
$('signOut').addEventListener('click', () => {
  localStorage.removeItem(STORE_KEY);
  state.key = '';
  renderFoot();
  openSheet(null);
});

// ── the clock: the one timer, ages and uptime ────────────────────────
setInterval(() => {
  if (!document.hidden && state.started) {
    renderStrip();
    tickCountdowns();
  }
}, 1000);

async function boot() {
  renderFoot();
  let info;
  try {
    info = await api('/v1/admin/info');
  } catch (e) {
    if (!(e instanceof ApiError) || (e.status !== 401 && e.status !== 403)) {
      setConn('critical', 'offline');
      toast(`Could not reach ${state.base}: ${e.message}`, 'critical');
    }
    return;
  }
  if (state.key) localStorage.setItem(STORE_KEY, state.key);
  renderFoot();
  store.set('info', info);
  state.started = true;
  showTab();
  await refresh();
  connect();
}

// For the jsdom tests and the console: the pieces later tabs share.
window.rpAdmin = { store, state, api, table, confirmAction, toast, route };

buildTabs();
showTab();
boot();
    </script>
  </body>
