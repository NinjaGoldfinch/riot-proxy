<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>riot-proxy · dev explorer</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --sunk: #0b0e13; --line: #262d38;
    --text: #d7dee8; --dim: #7d8794; --accent: #58a6ff;
    --good: #2ea043; --bad: #d1444a; --warn: #d29922;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  a { color: var(--accent); }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; }
  header .links { margin-left: auto; display: flex; gap: 12px; }
  nav { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  nav a { padding: 8px 14px; color: var(--dim); text-decoration: none; border-bottom: 2px solid transparent; }
  nav a.on { color: var(--text); border-color: var(--accent); }
  main { padding: 16px; }
  .tab { display: none; } .tab.on { display: block; }
  .badge { font: 11px var(--mono); padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); }
  .badge.bad { color: #fff; background: var(--bad); border-color: var(--bad); }
  input, select, textarea, button { font: inherit; color: var(--text); background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; }
  textarea { font-family: var(--mono); font-size: 12px; width: 100%; min-height: 120px; }
  button { cursor: pointer; background: var(--panel); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04111f; font-weight: 600; }
  label { color: var(--dim); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; min-width: 0; overflow-x: auto; }
  .card h3 { margin: 0 0 8px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .card h3 button { margin-left: auto; font-size: 11px; padding: 1px 8px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .muted { color: var(--dim); }
  .mono { font-family: var(--mono); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.mono { overflow-wrap: anywhere; }
  th { color: var(--dim); font-weight: 500; }
  pre { margin: 0; padding: 10px; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.45 var(--mono); overflow: auto; max-height: 60vh; white-space: pre-wrap; word-break: break-all; }
  .m { font: 600 11px var(--mono); display: inline-block; min-width: 50px; }
  .m-GET { color: var(--dim); } .m-POST { color: var(--warn); } .m-DELETE { color: var(--bad); }
  .pill { font: 600 12px var(--mono); padding: 1px 8px; border-radius: 10px; color: #fff; background: var(--dim); }
  .s2 { background: var(--good); } .s3 { background: var(--accent); } .s4 { background: var(--warn); } .s5, .s0 { background: var(--bad); }
  .ok { color: var(--good); } .no { color: var(--bad); }
  /* explorer */
  .explorer { display: grid; grid-template-columns: 330px 1fr; gap: 16px; align-items: start; }
  .ops { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-height: calc(100vh - 140px); overflow: auto; }
  .ops input { width: calc(100% - 16px); margin: 8px; }
  .ops h4 { margin: 8px 10px 2px; font-size: 11px; text-transform: uppercase; color: var(--dim); letter-spacing: .05em; }
  .ops a { display: block; padding: 2px 10px; color: var(--text); text-decoration: none; font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ops a:hover, .ops a.on { background: var(--sunk); }
  .params { display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: center; margin: 10px 0; }
  .params input, .params select { width: 100%; }
  .req { color: var(--bad); }
  /* viewer */
  .viewer .head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { font: 11px var(--mono); padding: 2px 8px; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; }
  .chip b { color: var(--accent); font-weight: 500; }
  .err { background: #3a1416; border: 1px solid var(--bad); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); }
  details > summary { cursor: pointer; color: var(--dim); margin: 6px 0; }
  .j-k { color: #79c0ff; } .j-s { color: #a5d6ff; } .j-n { color: #ffa657; } .j-b { color: #ff7b72; }
  /* live */
  .log { max-height: 65vh; overflow: auto; }
  .log details { border-bottom: 1px solid var(--line); }
  .log summary { font: 12px var(--mono); color: var(--text); margin: 0; padding: 3px 4px; }
  .bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .win { color: var(--good); } .loss { color: var(--bad); }
  @media (max-width: 900px) { .explorer { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>riot-proxy · dev explorer</h1>
  <span class="badge" id="ver">…</span>
  <span class="badge bad" id="noauth" hidden>AUTH DISABLED</span>
  <span class="row" id="keyBox"><label for="key">API key</label><input id="key" type="password" size="28" autocomplete="off" placeholder="Bearer key"></span>
  <span class="row"><label for="rid">X-Request-Id</label><input id="rid" size="16" placeholder="auto"></span>
  <span class="links" id="links"></span>
</header>
<nav id="nav">
  <a href="#explorer">Explorer</a><a href="#status">Status</a><a href="#player">Player</a><a href="#live">Live</a><a href="#history">History</a>
</nav>
<main>
  <section class="tab" id="tab-explorer">
    <div class="explorer">
      <div class="ops"><input id="opFilter" placeholder="filter operations…"><div id="opList"></div></div>
      <div>
        <div class="card" id="opForm"><span class="muted">Pick an operation, or use <b>Raw request</b> for any URL.</span></div>
        <div class="viewer" id="exView"></div>
      </div>
    </div>
  </section>

  <section class="tab" id="tab-status">
    <div class="row" style="margin-bottom:12px">
      <button id="stRefresh" class="primary">Refresh</button>
      <label><input type="checkbox" id="stAuto"> auto-refresh 5 s</label>
      <span class="muted" id="stAt"></span>
    </div>
    <div class="grid" id="stCards"></div>
    <div class="viewer" id="stView"></div>
  </section>

  <section class="tab" id="tab-player">
    <form class="row card" id="plForm">
      <input id="plId" size="28" placeholder="GameName#TAG" required>
      <select id="plPlatform" required></select>
      <label><input type="checkbox" id="plRefresh"> refresh (admin)</label>
      <button class="primary">Look up</button>
      <span class="muted" id="plMsg"></span>
    </form>
    <div id="plOut"></div>
    <div class="viewer" id="plView"></div>
  </section>

  <section class="tab" id="tab-live">
    <div class="card">
      <div class="row">
        <button id="wsConn" class="primary">Connect</button>
        <span class="mono" id="wsState">closed</span>
        <span class="muted">topics:</span>
        <label><input type="checkbox" value="patch" class="wsT" checked> patch</label>
        <label><input type="checkbox" value="metrics" class="wsT"> metrics</label>
        <label><input type="checkbox" value="ladder" class="wsT"> ladder</label>
        <label><input type="checkbox" value="firehose" class="wsT"> firehose</label>
        <input id="wsPlayer" size="30" placeholder="player:<puuid> (optional)">
        <button id="wsSub">Apply topics</button>
        <button id="wsPing">Ping</button>
        <label><input type="checkbox" id="wsPause"> pause</label>
        <input id="wsFilter" size="14" placeholder="filter…">
        <button id="wsClear">Clear</button>
      </div>
      <p class="muted mono" id="wsHeld">subscribed: —</p>
    </div>
    <div class="card log" id="wsLog"></div>
  </section>

  <section class="tab" id="tab-history">
    <div class="row" style="margin-bottom:12px"><button id="hClear">Clear history</button><span class="muted">last 50 requests, stored in this browser (no bodies)</span></div>
    <div class="card"><table><thead><tr><th>when</th><th>method</th><th>path</th><th>status</th><th>ms</th><th>request id</th><th></th></tr></thead><tbody id="hRows"></tbody></table></div>
    <div class="viewer" id="hView"></div>
  </section>
</main>

<script type="module">
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};
let cfg = { authDisabled: false, platforms: [], regions: [] };
let spec = { paths: {}, tags: [] };

// ---------- request core ----------
const KEY_HEADERS = ['x-cache', 'x-cache-age', 'x-request-id', 'x-ratelimit-limit', 'x-ratelimit-remaining', 'x-ratelimit-reset', 'retry-after', 'etag', 'content-type'];

function requestHeaders(body) {
  const h = {};
  const key = $('#key').value.trim();
  if (key && !cfg.authDisabled) h.Authorization = `Bearer ${key}`;
  if ($('#rid').value.trim()) h['X-Request-Id'] = $('#rid').value.trim();
  if (body != null) h['Content-Type'] = 'application/json';
  return h;
}

/** One call through the proxy, timed and measured; every tab uses it. */
async function call(method, path, body = null, { record = true } = {}) {
  const headers = requestHeaders(body);
  const t0 = performance.now();
  const res = { method, path, body, at: Date.now(), headers: [], status: 0, statusText: '', text: '', json: undefined, sent: { ...headers } };
  if (res.sent.Authorization) res.sent.Authorization = 'Bearer ••••';
  try {
    const r = await fetch(path, { method, headers, body: body ?? undefined });
    res.text = await r.text();
    res.status = r.status;
    res.statusText = r.statusText;
    res.headers = [...r.headers.entries()];
  } catch (e) {
    res.text = String(e);
    res.statusText = 'network error';
  }
  res.ms = Math.round(performance.now() - t0);
  res.bytes = new TextEncoder().encode(res.text).length;
  try { res.json = JSON.parse(res.text); } catch { /* not JSON */ }
  if (record) remember(res);
  return res;
}

function curl(res) {
  const q = (s) => `'${String(s).replace(/'/g, `'\\''`)}'`;
  const parts = [`curl -i -X ${res.method} ${q(location.origin + res.path)}`];
  if (!cfg.authDisabled) parts.push(`-H "Authorization: Bearer $RIOT_PROXY_KEY"`);
  if (res.sent['X-Request-Id']) parts.push(`-H ${q('X-Request-Id: ' + res.sent['X-Request-Id'])}`);
  if (res.body != null) parts.push(`-H 'Content-Type: application/json'`, `--data ${q(res.body)}`);
  return parts.join(' \\\n  ');
}

function prettyJson(v) {
  const s = JSON.stringify(v, null, 2);
  if (s.length > 1_000_000) return esc(s); // colouring a huge timeline is not worth the wait
  return esc(s).replace(/(&quot;(?:\\.|[^&\\]|&(?!quot;))*&quot;)(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g,
    (m, str, colon, lit) => str ? `<span class="${colon ? 'j-k' : 'j-s'}">${str}</span>${colon || ''}` : `<span class="${lit ? 'j-b' : 'j-n'}">${m}</span>`);
}

const fmtBytes = (n) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`;

const pending = (el, what) => (el.innerHTML = `<div class="card muted">sending ${esc(what)}…</div>`);

/** The shared response viewer. */
function view(el, res, title = 'Response') {
  if (!res) { el.innerHTML = ''; return; }
  const h = Object.fromEntries(res.headers);
  const chips = KEY_HEADERS.filter((k) => h[k] != null).map((k) => `<span class="chip">${k}: <b>${esc(h[k])}</b></span>`).join('');
  const e = res.json?.error;
  el.innerHTML = `<div class="card">
    <h3>${esc(title)}</h3>
    <div class="head">
      <span class="pill s${String(res.status)[0]}">${res.status || 'ERR'} ${esc(res.statusText)}</span>
      <span class="m m-${res.method}">${res.method}</span><span class="mono">${esc(res.path)}</span>
      <span class="muted">${res.ms} ms · ${fmtBytes(res.bytes)}</span>
    </div>
    ${e ? `<div class="err"><b>${esc(e.code)}</b> ${esc(e.message)}${e.retryAfter != null ? ` · retry after ${esc(e.retryAfter)} s` : ''} <span class="mono muted">${esc(e.requestId)}</span></div>` : ''}
    <div class="chips">${chips}</div>
    <div class="row seg">
      <button data-v="pretty" class="${res.json !== undefined ? 'on' : ''}" ${res.json === undefined ? 'disabled' : ''}>Pretty</button>
      <button data-v="raw" class="${res.json === undefined ? 'on' : ''}">Raw</button>
      <button data-c="body">Copy body</button><button data-c="curl">Copy as curl</button>
      ${h['x-request-id'] ? '<button data-c="rid">Copy request id</button>' : ''}
      <span class="muted" data-msg></span>
    </div>
    <pre data-body style="margin-top:8px"></pre>
    <details><summary>response headers (${res.headers.length})</summary><table>${res.headers.map(([k, v]) => `<tr><th class="mono">${esc(k)}</th><td class="mono">${esc(v)}</td></tr>`).join('')}</table></details>
    <details><summary>request</summary><pre>${esc(curl(res))}\n\n${esc(JSON.stringify(res.sent, null, 2))}</pre></details>
  </div>`;
  const pre = $('[data-body]', el);
  const show = (mode) => {
    pre.innerHTML = mode === 'pretty' ? prettyJson(res.json) : esc(res.text || '(empty body)');
    el.querySelectorAll('[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === mode));
  };
  show(res.json !== undefined ? 'pretty' : 'raw');
  el.querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => show(b.dataset.v)));
  el.querySelectorAll('[data-c]').forEach((b) => (b.onclick = async () => {
    const text = { body: res.text, curl: curl(res), rid: h['x-request-id'] }[b.dataset.c];
    await navigator.clipboard.writeText(text);
    $('[data-msg]', el).textContent = 'copied';
  }));
}

// ---------- history ----------
function remember(res) {
  const h = store.get('rp.dev.history', []);
  h.unshift({ at: res.at, method: res.method, path: res.path, body: res.body, status: res.status, ms: res.ms, rid: Object.fromEntries(res.headers)['x-request-id'] });
  store.set('rp.dev.history', h.slice(0, 50));
}

function renderHistory() {
  const h = store.get('rp.dev.history', []);
  $('#hRows').innerHTML = h.length ? h.map((r, i) => `<tr>
    <td class="muted">${new Date(r.at).toLocaleTimeString()}</td><td><span class="m m-${r.method}">${r.method}</span></td>
    <td class="mono">${esc(r.path)}</td><td><span class="pill s${String(r.status)[0]}">${r.status || 'ERR'}</span></td>
    <td>${r.ms}</td><td class="mono muted">${esc(r.rid)}</td>
    <td class="row"><button data-replay="${i}">Replay</button><button data-edit="${i}">Edit</button></td></tr>`).join('')
    : '<tr><td colspan="7" class="muted">nothing yet</td></tr>';
  $('#hRows').onclick = async (ev) => {
    const i = ev.target.dataset.replay ?? ev.target.dataset.edit;
    if (i == null) return;
    const r = h[i];
    if (ev.target.dataset.edit != null) { location.hash = 'explorer'; rawForm(r); return; }
    if (r.method !== 'GET' && !confirm(`${r.method} ${r.path}?`)) return;
    pending($('#hView'), r.path);
    view($('#hView'), await call(r.method, r.path, r.body), 'Replay');
    renderHistory();
  };
}

// ---------- explorer ----------
const METHODS = ['get', 'post', 'put', 'patch', 'delete'];

function operations() {
  const ops = [];
  for (const [path, item] of Object.entries(spec.paths)) {
    for (const m of METHODS) {
      if (!item[m]) continue;
      const o = item[m];
      ops.push({ id: `${m.toUpperCase()} ${path}`, method: m.toUpperCase(), path, tag: o.tags?.[0] ?? 'other', summary: o.summary ?? '', description: o.description ?? '', params: [...(item.parameters ?? []), ...(o.parameters ?? [])], body: o.requestBody });
    }
  }
  return ops;
}

const resolve = (s) => (s?.$ref ? spec.components?.schemas?.[s.$ref.split('/').pop()] ?? {} : s ?? {});

function skeleton(schema) {
  const s = resolve(schema);
  const out = {};
  for (const [k, p0] of Object.entries(s.properties ?? {})) {
    const p = resolve(p0);
    const t = [].concat(p.type ?? 'string').find((x) => x !== 'null');
    out[k] = p.example ?? p.default ?? p.enum?.[0] ?? { integer: 0, number: 0, boolean: false, array: [], object: {} }[t] ?? '';
  }
  return out;
}

function renderOpList() {
  const f = $('#opFilter').value.toLowerCase();
  const ops = operations().filter((o) => !f || `${o.id} ${o.summary}`.toLowerCase().includes(f));
  const order = (spec.tags ?? []).map((t) => t.name);
  const tags = [...new Set(ops.map((o) => o.tag))].sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  const current = decodeURIComponent(location.hash.split('?op=')[1] ?? '');
  $('#opList').innerHTML = `<a href="#explorer?op=RAW" class="${current === 'RAW' ? 'on' : ''}">✎ Raw request</a>` + tags.map((t) => `<h4>${esc(t)}</h4>` + ops.filter((o) => o.tag === t).map((o) =>
    `<a href="#explorer?op=${encodeURIComponent(o.id)}" title="${esc(o.summary)}" class="${o.id === current ? 'on' : ''}"><span class="m m-${o.method}">${o.method}</span>${esc(o.path)}</a>`).join('')).join('');
}

function paramInput(p, remembered) {
  const s = resolve(p.schema);
  const id = `p-${p.in}-${p.name}`;
  const v = esc(remembered[p.name] ?? '');
  if (s.enum) return `<select id="${id}"><option value=""></option>${s.enum.map((e) => `<option ${String(e) === remembered[p.name] ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>`;
  if ([].concat(s.type).includes('boolean')) return `<select id="${id}"><option value=""></option><option ${remembered[p.name] === 'true' ? 'selected' : ''}>true</option><option ${remembered[p.name] === 'false' ? 'selected' : ''}>false</option></select>`;
  const list = { platform: 'dl-platform', region: 'dl-region' }[p.name];
  return `<input id="${id}" value="${v}" ${list ? `list="${list}"` : ''} placeholder="${esc([].concat(s.type ?? '').join('|'))}">`;
}

function opForm(op) {
  const el = $('#opForm');
  el.oninput = null;
  if (op.path === '/v1/ws') {
    el.innerHTML = `<h3><span class="m m-GET">GET</span> /v1/ws</h3><p>WebSocket upgrade. Use the <a href="#live">Live</a> tab.</p>`;
    return;
  }
  const remembered = store.get('rp.dev.params', {});
  el.innerHTML = `<h3><span class="m m-${op.method}">${op.method}</span><span class="mono">${esc(op.path)}</span></h3>
    <div>${esc(op.summary)}</div>
    ${op.description && op.description !== op.summary ? `<details><summary>description</summary><div class="muted" style="white-space:pre-wrap">${esc(op.description)}</div></details>` : ''}
    ${op.params.length ? `<div class="params">${op.params.map((p) => `<label for="p-${p.in}-${p.name}" title="${esc(p.description)}">${esc(p.name)}${p.required ? '<span class="req">*</span>' : ''} <span class="muted">${p.in}</span></label>${paramInput(p, remembered)}`).join('')}</div>` : ''}
    ${op.body ? `<label>JSON body</label><textarea id="opBody">${esc(JSON.stringify(skeleton(op.body.content?.['application/json']?.schema), null, 2))}</textarea>` : ''}
    <div class="row" style="margin-top:8px"><button class="primary" id="opSend">Send</button><span class="mono muted" id="opUrl"></span></div>`;
  const build = () => {
    let path = op.path;
    const qs = new URLSearchParams();
    for (const p of op.params) {
      const v = $(`#p-${p.in}-${p.name}`, el).value.trim();
      if (p.in === 'path') path = path.replace(`{${p.name}}`, v ? encodeURIComponent(v) : `{${p.name}}`);
      else if (p.in === 'query' && v !== '') qs.set(p.name, v);
    }
    return path + (qs.size ? `?${qs}` : '');
  };
  const sync = () => ($('#opUrl').textContent = build());
  el.oninput = sync;
  sync();
  $('#opSend').onclick = async () => {
    const url = build();
    if (url.includes('{')) { $('#opUrl').textContent = 'fill the required path parameters'; return; }
    const keep = store.get('rp.dev.params', {});
    for (const p of op.params) { const v = $(`#p-${p.in}-${p.name}`, el).value.trim(); if (v) keep[p.name] = v; }
    store.set('rp.dev.params', keep);
    const body = $('#opBody', el)?.value.trim() || null;
    if (op.method !== 'GET' && !confirm(`${op.method} ${url}?`)) return;
    pending($('#exView'), url);
    view($('#exView'), await call(op.method, url, body));
  };
}

function rawForm(prefill = {}) {
  const el = $('#opForm');
  el.oninput = null;
  el.innerHTML = `<h3>Raw request</h3><p class="muted">Any same-origin path: unknown routes, <span class="mono">/ddragon/*</span>, <span class="mono">/metrics</span>…</p>
    <div class="row"><select id="rawM">${METHODS.map((m) => `<option ${m.toUpperCase() === prefill.method ? 'selected' : ''}>${m.toUpperCase()}</option>`).join('')}</select>
    <input id="rawP" style="flex:1" value="${esc(prefill.path ?? '/healthz')}"></div>
    <label>body (optional)</label><textarea id="rawB">${esc(prefill.body ?? '')}</textarea>
    <div class="row" style="margin-top:8px"><button class="primary" id="rawSend">Send</button></div>`;
  $('#rawSend').onclick = async () => {
    const m = $('#rawM').value;
    const p = $('#rawP').value.trim();
    if (m !== 'GET' && !confirm(`${m} ${p}?`)) return;
    pending($('#exView'), p);
    view($('#exView'), await call(m, p, $('#rawB').value.trim() || null));
  };
}

function showOp() {
  renderOpList();
  const id = decodeURIComponent(location.hash.split('?op=')[1] ?? '');
  if (id === 'RAW') return rawForm();
  const op = operations().find((o) => o.id === id);
  if (op) opForm(op);
}

// ---------- status ----------
const kv = (o) => `<table>${Object.entries(o ?? {}).map(([k, v]) => `<tr><th>${esc(k)}</th><td class="mono">${esc(typeof v === 'object' && v !== null ? JSON.stringify(v) : v)}</td></tr>`).join('')}</table>`;
const flag = (b) => `<span class="${b ? 'ok' : 'no'}">${b ? '●' : '○'}</span>`;
const statusRes = {};

async function refreshStatus() {
  const [hz, rz, m] = await Promise.all([call('GET', '/healthz', null, { record: false }), call('GET', '/readyz', null, { record: false }), call('GET', '/v1/admin/metrics', null, { record: false })]);
  Object.assign(statusRes, { healthz: hz, readyz: rz, metrics: m });
  const card = (name, title, body) => `<div class="card"><h3>${title}<button data-raw="${name}">raw</button></h3>${body}</div>`;
  const r = rz.json ?? {};
  let html = card('readyz', `Health <span class="pill s${String(rz.status)[0]}">${rz.status}</span>`,
    `<div class="row">${flag(hz.json?.ok)} healthz ${flag(r.sqlite)} sqlite ${flag(r.limiter)} limiter ${flag(r.ok)} ready</div><p class="muted mono">keyScope: ${esc(r.keyScope)}</p>`);
  const s = m.json;
  if (m.status !== 200 || !s) {
    html += card('metrics', 'Admin metrics', `<div class="err">${esc(s?.error?.code ?? m.status)} ${esc(s?.error?.message ?? 'unavailable')}</div><p class="muted">Needs an admin key (or AUTH_DISABLED).</p>`);
  } else {
    const c = s.cache ?? {};
    const reads = (c.hit ?? 0) + (c.miss ?? 0) + (c.stale ?? 0) + (c.neg ?? 0);
    html += card('metrics', 'Totals', kv({ ...s.totals, rss: fmtBytes(s.process?.rssBytes ?? 0), uptime: `${Math.round(s.process?.uptimeSeconds ?? 0)} s`, worker: s.worker?.alive ? 'alive' : 'down', wsConnections: s.ws?.connections, wsSubscriptions: s.ws?.subscriptions }));
    html += card('metrics', `Cache <span class="muted">${reads ? Math.round(((c.hit + (c.stale ?? 0) + (c.neg ?? 0)) / reads) * 100) : 0}% served from cache</span>`, kv(c));
    html += card('metrics', 'Queues', `<table><tr><th></th>${['waiting', 'active', 'delayed', 'completed', 'failed'].map((k) => `<th>${k}</th>`).join('')}</tr>${Object.entries(s.queues ?? {}).map(([q, n]) => `<tr><th>${esc(q)}</th>${['waiting', 'active', 'delayed', 'completed', 'failed'].map((k) => `<td class="${k === 'failed' && n[k] ? 'no' : ''}">${n[k] ?? 0}</td>`).join('')}</tr>`).join('')}</table>`);
    const win = (name, w, i, cls = '') => `<tr class="${cls}"><td class="mono">${i ? '' : name}</td><td class="mono">${esc(w.window)}</td><td>${w.used}/${w.limit}</td><td><div class="bar"><i style="width:${Math.min(100, (w.used / (w.limit || 1)) * 100)}%"></i></div></td></tr>`;
    html += card('metrics', 'Rate limiter', `<table><tr><th>scope / method</th><th>window</th><th>used</th><th></th></tr>${(s.limiter ?? []).map((l) =>
      (l.windows ?? []).map((w, i) => win(`${esc(l.label || l.scope)}${l.frozenMs ? ` <span class="no">frozen ${l.frozenMs} ms</span>` : ''}`, w, i)).join('') +
      (l.methods ?? []).flatMap((m) => (m.windows ?? []).map((w, i) => win(`&nbsp;&nbsp;${esc(m.method)}`, w, i, 'muted'))).join('')).join('') || '<tr><td colspan="4" class="muted">no Riot calls yet</td></tr>'}</table>`);
    html += card('metrics', 'Events emitted', Object.keys(s.events ?? {}).length ? kv(s.events) : '<span class="muted">none since start</span>');
  }
  $('#stCards').innerHTML = html;
  $('#stAt').textContent = `updated ${new Date().toLocaleTimeString()}`;
  $('#stCards').onclick = (ev) => ev.target.dataset.raw && view($('#stView'), statusRes[ev.target.dataset.raw], ev.target.dataset.raw);
}

let stTimer = null;
$('#stRefresh').onclick = refreshStatus;
$('#stAuto').onchange = (ev) => { clearInterval(stTimer); if (ev.target.checked) stTimer = setInterval(() => location.hash.startsWith('#status') && refreshStatus(), 5000); };

// ---------- player ----------
let champNames = null;
async function championNames() {
  if (champNames) return champNames;
  const r = await call('GET', '/v1/static/champion', null, { record: false });
  champNames = Object.fromEntries(Object.values(r.json?.data ?? {}).map((c) => [Number(c.key), c.name]));
  return champNames;
}

$('#plForm').onsubmit = async (ev) => {
  ev.preventDefault();
  const [name, tag] = $('#plId').value.split('#').map((s) => s.trim());
  const platform = $('#plPlatform').value;
  if (!name || !tag) { $('#plMsg').textContent = 'use GameName#TAG'; return; }
  store.set('rp.dev.player', { id: $('#plId').value, platform });
  const refresh = $('#plRefresh').checked ? '&refresh=true' : '';
  $('#plMsg').textContent = 'loading…';
  $('#plOut').innerHTML = '';
  const prof = await call('GET', `/v1/players/by-riot-id/${encodeURIComponent(name)}/${encodeURIComponent(tag)}/profile?platform=${platform}&topMastery=5${refresh}`);
  const raws = { profile: prof };
  if (prof.status !== 200) { $('#plMsg').textContent = ''; view($('#plView'), prof, 'profile'); return; }
  const p = prof.json;
  const [matches, names] = await Promise.all([call('GET', `/v1/players/${p.puuid}/matches?platform=${platform}&count=10${refresh}`), championNames()]);
  raws.matches = matches;
  $('#plMsg').textContent = `${prof.ms + matches.ms} ms`;
  const champ = (id) => names[id] ?? `#${id}`;
  const card = (name, title, body) => `<div class="card"><h3>${title}<button data-raw="${name}">raw</button></h3>${body}</div>`;
  const xc = (r) => `<span class="chip">X-Cache: <b>${esc(Object.fromEntries(r.headers)['x-cache'] ?? '—')}</b></span>`;
  const league = (p.league ?? []).map((e) => `<tr><td>${esc(e.queueType)}</td><td>${esc(e.tier)} ${esc(e.rank)}</td><td>${e.leaguePoints} LP</td><td>${e.wins}W ${e.losses}L</td><td>${Math.round((e.wins / ((e.wins + e.losses) || 1)) * 100)}%</td></tr>`).join('');
  const mastery = (p.mastery ?? []).map((m) => `<tr><td>${esc(champ(m.championId))}</td><td>lvl ${m.championLevel}</td><td>${Number(m.championPoints).toLocaleString()}</td></tr>`).join('');
  const rows = (matches.json?.matches ?? []).map((g) => {
    const s = g.player ?? {};
    const res = s.gameEndedInEarlySurrender ? ['remake', 'muted'] : s.win ? ['win', 'win'] : ['loss', 'loss'];
    return `<tr><td class="${res[1]}">${res[0]}</td><td>${esc(s.championName ?? champ(s.championId))}</td><td>${s.kills}/${s.deaths}/${s.assists}</td><td>${(s.totalMinionsKilled ?? 0) + (s.neutralMinionsKilled ?? 0)} cs</td><td>${esc(g.gameMode)} ${g.queueId ?? ''}</td><td>${Math.round((g.gameDuration ?? 0) / 60)}m</td><td class="muted">${g.gameEndTimestamp ? new Date(g.gameEndTimestamp).toLocaleString() : ''}</td><td><a href="#" data-match="${esc(g.matchId)}" class="mono">${esc(g.matchId)}</a></td></tr>`;
  }).join('');
  $('#plOut').innerHTML = `<div class="grid">
    ${card('profile', `${esc(p.account?.gameName)}<span class="muted">#${esc(p.account?.tagLine)}</span> ${xc(prof)}`, kv({ level: p.summoner?.summonerLevel, platform: p.platform, region: p.region, puuid: p.puuid, refreshAvailableIn: `${p.refreshAvailableIn} s`, ageSeconds: p.ageSeconds }) + (p.warnings?.length ? `<div class="err">${esc(p.warnings.join('; '))}</div>` : ''))}
    ${card('profile', 'Ranked', league ? `<table>${league}</table>` : `<span class="muted">${p.league ? 'unranked' : 'unavailable (see warnings)'}</span>`)}
    ${card('profile', 'Top mastery', mastery ? `<table>${mastery}</table>` : `<span class="muted">${p.mastery ? 'none' : 'unavailable (see warnings)'}</span>`)}
    </div>${card('matches', `Recent matches ${xc(matches)} ${matches.json?.backfill ? '<span class="chip">backfill queued</span>' : ''}`, rows ? `<table><tr><th></th><th>champion</th><th>KDA</th><th>CS</th><th>mode</th><th>length</th><th>ended</th><th>match</th></tr>${rows}</table>` : `<span class="muted">${matches.status === 200 ? 'no matches' : esc(matches.json?.error?.message ?? matches.status)}</span>`)}`;
  $('#plOut').onclick = async (e) => {
    if (e.target.dataset.raw) view($('#plView'), raws[e.target.dataset.raw], e.target.dataset.raw);
    if (e.target.dataset.match) {
      e.preventDefault();
      view($('#plView'), await call('GET', `/v1/lol/matches/${p.region}/${e.target.dataset.match}`), e.target.dataset.match);
    }
  };
  view($('#plView'), null);
};

// ---------- live ----------
let ws = null;
let held = [];
const frames = [];

function topics() {
  const t = [...document.querySelectorAll('.wsT:checked')].map((c) => c.value);
  const p = $('#wsPlayer').value.trim();
  if (p) t.push(p.startsWith('player:') ? p : `player:${p}`);
  return t;
}

function renderFrames() {
  const f = $('#wsFilter').value.toLowerCase();
  $('#wsLog').innerHTML = frames.filter((x) => !f || x.raw.toLowerCase().includes(f)).map((x) =>
    `<details><summary>${new Date(x.at).toLocaleTimeString()} <span class="${x.dir === '→' ? 'm-POST' : ''}">${x.dir}</span> <b>${esc(x.msg.op)}</b> ${esc(x.msg.event ?? '')} <span class="muted">${esc(x.msg.topic ?? '')}</span></summary><pre>${prettyJson(x.msg)}</pre></details>`).join('') || '<span class="muted">no frames</span>';
}

function logFrame(dir, msg) {
  if ($('#wsPause').checked && dir === '←') return;
  frames.unshift({ at: Date.now(), dir, msg, raw: JSON.stringify(msg) });
  frames.length = Math.min(frames.length, 500);
  renderFrames();
}

function send(msg) { if (ws?.readyState === 1) { ws.send(JSON.stringify(msg)); logFrame('→', msg); } }

$('#wsConn').onclick = () => {
  if (ws) { ws.close(); return; }
  const key = $('#key').value.trim();
  const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/v1/ws${key && !cfg.authDisabled ? `?token=${encodeURIComponent(key)}` : ''}`;
  ws = new WebSocket(url);
  $('#wsState').textContent = 'connecting…';
  ws.onopen = () => { $('#wsState').textContent = 'open'; $('#wsConn').textContent = 'Disconnect'; send({ op: 'subscribe', topics: topics() }); };
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { msg = { op: 'raw', data: e.data }; }
    if (msg.op === 'subscribed') { held = msg.topics; $('#wsHeld').textContent = `subscribed: ${held.join(', ') || '—'}`; }
    logFrame('←', msg);
  };
  ws.onclose = (e) => { $('#wsState').textContent = `closed (${e.code}${e.reason ? ` ${e.reason}` : ''})`; $('#wsConn').textContent = 'Connect'; ws = null; held = []; };
};
$('#wsSub').onclick = () => {
  const want = topics();
  const drop = held.filter((t) => !want.includes(t));
  if (drop.length) send({ op: 'unsubscribe', topics: drop });
  send({ op: 'subscribe', topics: want });
};
$('#wsPing').onclick = () => send({ op: 'ping' });
$('#wsClear').onclick = () => { frames.length = 0; renderFrames(); };
$('#wsFilter').oninput = renderFrames;

// ---------- shell ----------
function route() {
  const tab = location.hash.slice(1).split('?')[0] || 'explorer';
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.id === `tab-${tab}`));
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.getAttribute('href') === `#${tab}`));
  if (tab === 'explorer') showOp();
  if (tab === 'status' && !$('#stCards').innerHTML) refreshStatus();
  if (tab === 'history') renderHistory();
  if (tab === 'live') renderFrames();
}

async function boot() {
  $('#key').value = store.get('rp.dev.key', '');
  $('#key').onchange = () => store.set('rp.dev.key', $('#key').value.trim());
  [cfg, spec] = await Promise.all([fetch('/dev/config.json').then((r) => r.json()), fetch('/dev/openapi.json').then((r) => r.json())]);
  $('#ver').textContent = `v${cfg.version} · ${cfg.env}`;
  $('#noauth').hidden = !cfg.authDisabled;
  $('#keyBox').hidden = cfg.authDisabled;
  $('#links').innerHTML = [cfg.docsUi && '<a href="/docs">API docs</a>', cfg.dashboardUi && '<a href="/dashboard">Dashboard</a>', '<a href="/metrics">/metrics</a>'].filter(Boolean).join('');
  document.body.insertAdjacentHTML('beforeend', `<datalist id="dl-platform">${cfg.platforms.map((p) => `<option value="${esc(p.value)}">${esc(p.label)}</option>`).join('')}</datalist><datalist id="dl-region">${cfg.regions.map((r) => `<option value="${esc(r)}">`).join('')}</datalist>`);
  const last = store.get('rp.dev.player', {});
  $('#plPlatform').innerHTML = `<option value="">platform…</option>${cfg.platforms.map((p) => `<option value="${esc(p.value)}" ${p.value === last.platform ? 'selected' : ''}>${esc(p.value)} · ${esc(p.label)}</option>`).join('')}`;
  $('#plId').value = last.id ?? '';
  $('#opFilter').oninput = renderOpList;
  window.onhashchange = route;
  route();
}
boot();
</script>
