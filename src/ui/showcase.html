<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>riot-proxy · showcase</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --sunk: #0b0e13; --line: #262d38;
    --text: #d7dee8; --dim: #7d8794; --accent: #58a6ff;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; }

  button { cursor: pointer; background: var(--panel); }
  button:hover, button.on { border-color: var(--accent); }
  button.on { color: var(--accent); }
  .hero { padding: 28px 20px 22px; background: linear-gradient(180deg, #131a24, var(--bg)); border-bottom: 1px solid var(--line); }
  .hero-in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: end; }
  .hero h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }

  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; min-width: 0; }
  .card > header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .card h2 { margin: 0; font-size: 15px; }
  .card .tools { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }

  .card .tools select { font-size: 12px; padding: 2px 6px; }
  .src { font: 11px var(--mono); color: var(--dim); border: 1px dashed var(--line); border-radius: 4px; padding: 1px 6px; display: inline-block; margin: 2px 4px 0 0; max-width: calc(100% - 4px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }

  .flag.hot { color: #ff9b5e; border-color: #6b3a1f; background: #2a1810; }

  /* The class sets an icon's size; an image of any natural size fills exactly that box. */
  .icon { width: 48px; height: 48px; flex: none; box-sizing: border-box; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); display: inline-grid; place-items: center; font: 700 14px var(--mono); color: var(--dim); overflow: hidden; vertical-align: middle; }

<script type="application/json" id="coverage">

<script type="module">
// ---------- pure helpers (unit-tested by tests/showcase.mjs)
/** Riot's apex tiers, highest first, and the badge colour for each tier. */
const APEX = ['CHALLENGER', 'GRANDMASTER', 'MASTER'];
/** League queue type, label, and its queueId in Riot's queues.json. */
const QUEUES = [['RANKED_SOLO_5x5', 'Solo/Duo', 420], ['RANKED_FLEX_SR', 'Flex', 440]];
/** Every ranked tier, highest first. */
const TIERS = ['CHALLENGER', 'GRANDMASTER', 'MASTER', 'DIAMOND', 'EMERALD', 'PLATINUM', 'GOLD', 'SILVER', 'BRONZE', 'IRON'];
/** Summoner's Rift sides by match-v5 teamId. */
const SIDES = { 100: 'Blue side', 200: 'Red side' };
const TIER_COLOURS = { IRON: '#8c8580', BRONZE: '#b0764a', SILVER: '#9fb2c0', GOLD: '#e0b44c', PLATINUM: '#4fb3a9', EMERALD: '#3dbb6d', DIAMOND: '#6f8ff0', MASTER: '#b765d8', GRANDMASTER: '#e0525a', CHALLENGER: '#f2c94c' };
const LADDER_PAGE = 25;
/** Most players Riot lists in one apex league: observed, not documented (`RIOT_APEX_LIST_CAP` in src/riot/ladder.rs, LAD-01). */
const APEX_LIST_CAP = 10000;

const tierColour = (tier) => TIER_COLOURS[String(tier).toUpperCase()] ?? '#7d8794';
const winRate = (wins, losses) => (wins + losses > 0 ? wins / (wins + losses) : null);
const pct = (r, digits = 1) => (r == null ? '–' : `${(r * 100).toFixed(digits)}%`);
const titleCase = (s) => String(s).charAt(0) + String(s).slice(1).toLowerCase();

/** A whole apex league, highest LP first; ties go to more wins. Rank is the position. */
function sortLadder(entries) {
  return [...(entries ?? [])]
    .sort((a, b) => b.leaguePoints - a.leaguePoints || b.wins - a.wins)
    .map((e, i) => ({ ...e, position: i + 1 }));
}

/** The note under a league Riot cut off at its cap, e.g. `Master: top 10,000 only (Riot API limit)`; '' below the cap. */
function apexCapNote(tier, players) {
  return players >= APEX_LIST_CAP ? `${titleCase(tier)}: top ${APEX_LIST_CAP.toLocaleString('en-US')} only (Riot API limit)` : '';
}

/** One page of a sorted ladder, and how many pages there are. */
function ladderPage(sorted, page, size = LADDER_PAGE) {
  const pages = Math.max(1, Math.ceil(sorted.length / size));
  const p = Math.min(Math.max(0, page), pages - 1);
  return { page: p, pages, rows: sorted.slice(p * size, p * size + size) };
}

/** Data Dragon's champion.json keyed by numeric id: `{ id, name, title, image }`. */
function championIndex(doc) {
  const out = {};
  for (const c of Object.values(doc?.data ?? {})) out[Number(c.key)] = { id: c.id, name: c.name, title: c.title, image: c.image?.full };
  return out;
}

/** A mirrored Data Dragon image (ADR-076), or null without a patch or file. */
const imageUrl = (version, kind, file) => (version && file ? `/ddragon/${encodeURIComponent(version)}/img/${kind}/${encodeURIComponent(file)}` : null);

/** A mirrored rune or rune style icon, `icon` being runesReforged.json's `perk-images/…` path. */
const runeUrl = (version, icon) => (version && /^perk-images\//.test(icon ?? '') ? `/ddragon/${encodeURIComponent(version)}/img/${icon.split('/').map(encodeURIComponent).join('/')}` : null);

/** lol-status-v4 incidents and maintenances, titled in `locale` (falling back to en_US, then the first). */
function statusNotices(doc, locale = 'en_US') {
  const title = (s) => {
    const ts = s.titles ?? [];
    return (ts.find((t) => t.locale === locale) ?? ts.find((t) => t.locale === 'en_US') ?? ts[0])?.content ?? '(untitled)';
  };
  return [
    ...(doc?.maintenances ?? []).map((s) => ({ kind: 'Maintenance', severity: s.maintenance_status ?? '', title: title(s) })),
    ...(doc?.incidents ?? []).map((s) => ({ kind: 'Incident', severity: s.incident_severity ?? '', title: title(s) })),
  ];
}

/** Analytics rows come per (champion, tier); sum them per champion. */
function byChampion(rows) {
  const m = new Map();
  for (const r of rows ?? []) {
    const c = m.get(r.championId) ?? { championId: r.championId, championName: r.championName, games: 0, wins: 0 };
    c.games += r.games;
    c.wins += r.wins;
    m.set(r.championId, c);
  }
  return [...m.values()].map((c) => ({ ...c, winRate: c.games ? c.wins / c.games : 0 }));
}

/** The top `n` champions by win rate and by games played. */
function topChampions(rows, n = 10) {
  const all = byChampion(rows);
  return {
    winRate: [...all].sort((a, b) => b.winRate - a.winRate || b.games - a.games).slice(0, n),
    played: [...all].sort((a, b) => b.games - a.games || b.winRate - a.winRate).slice(0, n),
  };
}

/** `Name#TAG` → `{ gameName, tagLine }`, or null. */
function parseRiotId(s) {
  const m = String(s ?? '').trim().match(/^([^#]+?)\s*#\s*([^#\s][^#]*)$/);
  return m ? { gameName: m[1].trim(), tagLine: m[2].trim() } : null;
}

/** `#/`, `#/player/{name}/{tag}`, `#/champion/{id}` → `{ view, args }`. */
function parseRoute(hash) {
  const parts = String(hash ?? '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if (parts[0] === 'player' && parts.length === 3) return { view: 'player', args: { gameName: parts[1], tagLine: parts[2] } };
  if (parts[0] === 'champion' && /^\d+$/.test(parts[1] ?? '')) return { view: 'champion', args: { id: Number(parts[1]) } };
  if (parts[0] === 'match' && parts.length === 3 && /^[a-z]+$/.test(parts[1]) && /^[A-Z0-9]+_\d+$/.test(parts[2])) return { view: 'match', args: { region: parts[1], matchId: parts[2] } };
  return { view: 'home', args: {} };
}

/** The dev explorer's link to one operation (design/10). */
const explorerLink = (op) => `/dev#explorer?op=${encodeURIComponent(op)}`;

/** `Gold II`, or just `Challenger` for an apex tier, which has no divisions. */
const rankLabel = (e) => (e?.tier ? `${titleCase(e.tier)}${APEX.includes(e.tier) ? '' : ` ${e.rank ?? ''}`}`.trim() : 'Unranked');

/** league-v4 entries as one card per ranked queue: Solo/Duo and Flex always (null when unranked), then any other queue. */
function rankCards(league) {
  const list = Array.isArray(league) ? league : [];
  const known = QUEUES.map(([q, label]) => ({ queueType: q, label, entry: list.find((e) => e.queueType === q) ?? null }));
  const other = list.filter((e) => !QUEUES.some(([q]) => q === e.queueType)).map((e) => ({ queueType: e.queueType, label: e.queueType, entry: e }));
  return [...known, ...other];
}

/** Riot's queues.json as `{ queueId: description }`. */
function queueNames(list) {
  return Object.fromEntries((Array.isArray(list) ? list : []).filter((q) => q.description).map((q) => [q.queueId, q.description]));
}

/** Data Dragon's summoner.json keyed by numeric key → image file. */
function spellIndex(doc) {
  const out = {};
  for (const s of Object.values(doc?.data ?? {})) out[Number(s.key)] = s.image?.full;
  return out;
}

/** A match summary's result for its player: an Arena placement, a remake, a win or a loss. */
function outcome(p) {
  if (p?.placement) return { kind: 'place', label: `#${p.placement}` };
  if (p?.gameEndedInEarlySurrender) return { kind: 'remake', label: 'Remake' };
  if (p?.win === true) return { kind: 'win', label: 'Victory' };
  if (p?.win === false) return { kind: 'loss', label: 'Defeat' };
  return { kind: 'unknown', label: '–' };
}

/** `12.3k` from 1,000 up, else the number. */
const thousands = (n) => (Math.abs(n ?? 0) >= 1000 ? `${((n ?? 0) / 1000).toFixed(1)}k` : String(n ?? 0));

/** (kills + assists) / deaths, deaths floored at 1, as the champion pool computes it. */
const kda = (k, d, a) => ((k ?? 0) + (a ?? 0)) / Math.max(1, d ?? 0);

/** match-v5 `gameDuration` in seconds: it was milliseconds before `gameEndTimestamp` existed. */
const durationSecs = (m) => (m?.gameDuration == null ? null : m.gameEndTimestamp == null ? Math.round(m.gameDuration / 1000) : m.gameDuration);

/** `31:05`, or `1:02:09` past an hour. */
function clock(secs) {
  if (secs == null || secs < 0) return '–';
  const s = Math.floor(secs);
  const mm = String(Math.floor((s % 3600) / 60)).padStart(s >= 3600 ? 2 : 1, '0');
  return `${s >= 3600 ? `${Math.floor(s / 3600)}:` : ''}${mm}:${String(s % 60).padStart(2, '0')}`;
}

/** How long ago a unix-ms time was, coarsely. */
function ago(ms, now = Date.now()) {
  if (!ms) return '';
  const m = Math.max(0, Math.round((now - ms) / 60000));
  if (m < 60) return `${m} min ago`;
  if (m < 48 * 60) return `${Math.round(m / 60)} h ago`;
  return `${Math.round(m / 1440)} d ago`;
}

/** champion-mastery-v4's list, highest points first, with totals. */
function masterySummary(list) {
  const all = [...(Array.isArray(list) ? list : [])].sort((a, b) => b.championPoints - a.championPoints);
  return { champions: all.length, points: all.reduce((n, m) => n + (m.championPoints ?? 0), 0), list: all };
}

/** spectator-v5's CurrentGameInfo as teams of participants, the player marked, and seconds played. */
function liveGame(doc, puuid, now = Date.now()) {
  const teams = new Map();
  for (const p of doc?.participants ?? []) {
    if (!teams.has(p.teamId)) teams.set(p.teamId, []);
    teams.get(p.teamId).push({ ...p, me: p.puuid === puuid });
  }
  const me = (doc?.participants ?? []).find((p) => p.puuid === puuid) ?? null;
  // gameStartTime is 0 while the game loads; gameLength is Riot's own count then.
  const secs = doc?.gameStartTime > 0 ? Math.round((now - doc.gameStartTime) / 1000) : (doc?.gameLength ?? null);
  return { queueId: doc?.gameQueueConfigId ?? null, mode: doc?.gameMode ?? '', secs, me, teams: [...teams.entries()].sort(([a], [b]) => a - b).map(([teamId, players]) => ({ teamId, players })) };
}

// ---------- match detail and champion view (DEV-08)

/** A match's link in the showcase: `#/match/{region}/{matchId}`. */
const matchHref = (region, matchId) => `#/match/${encodeURIComponent(region)}/${encodeURIComponent(matchId)}`;

/**
 * A match-v5 body as teams of player lines, the player `puuid` marked. Arena groups by
 * `playerSubteamId` and orders by placement; everything else by `teamId`.
 */
function matchTeams(match, puuid) {
  const info = match?.info ?? {};
  const parts = info.participants ?? [];
  const arena = parts.some((p) => p.playerSubteamId);
  const groups = new Map();
  for (const p of parts) {
    const key = arena ? p.playerSubteamId : p.teamId;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({
      ...p, me: p.puuid === puuid,
      cs: (p.totalMinionsKilled ?? 0) + (p.neutralMinionsKilled ?? 0),
    });
  }
  const teams = [...groups.entries()].map(([key, players]) => {
    const t = arena ? null : (info.teams ?? []).find((x) => x.teamId === key);
    const sum = (k) => players.reduce((n, p) => n + (p[k] ?? 0), 0);
    return {
      key, arena,
      label: arena ? `#${players[0]?.placement ?? '?'}` : (SIDES[key] ?? `Team ${key}`),
      placement: arena ? (players[0]?.placement ?? 99) : null,
      win: arena ? null : Boolean(t?.win ?? players[0]?.win),
      bans: (t?.bans ?? []).map((b) => b.championId).filter((id) => id > 0),
      objectives: t?.objectives ?? {},
      players,
      totals: { kills: sum('kills'), deaths: sum('deaths'), assists: sum('assists'), gold: sum('goldEarned'), damage: sum('totalDamageDealtToChampions') },
    };
  });
  return arena ? teams.sort((a, b) => a.placement - b.placement) : teams.sort((a, b) => a.key - b.key);
}

/**
 * Blue side's total gold minus red side's, per timeline frame. Participants are
 * placed on a side through the match's own `participantId` → `teamId`. Empty unless
 * the match is two teams, 100 and 200.
 */
function goldDiff(timeline, match) {
  const side = new Map((match?.info?.participants ?? []).map((p) => [p.participantId, p.teamId]));
  const teams = new Set(side.values());
  if (teams.size !== 2 || !teams.has(100) || !teams.has(200)) return [];
  return (timeline?.info?.frames ?? []).map((f) => {
    let diff = 0;
    for (const [id, pf] of Object.entries(f.participantFrames ?? {})) {
      const t = side.get(Number(pf.participantId ?? id));
      diff += (t === 100 ? 1 : t === 200 ? -1 : 0) * (pf.totalGold ?? 0);
    }
    return { minute: Math.round((f.timestamp ?? 0) / 60000), diff };
  });
}

/** A symmetric gold axis: the smallest 1k, 2k, 5k, 10k … step that holds the widest lead. */
function goldScale(points) {
  const max = Math.max(1000, ...points.map((p) => Math.abs(p.diff)));
  for (const step of [1000, 2000, 5000, 10000, 20000, 50000]) if (max <= step * 2) return { max: step * 2, step };
  return { max: Math.ceil(max / 50000) * 50000, step: 50000 };
}

/** `+2.3k`, `−800`, `0`. */
const signedGold = (n) => (n === 0 ? '0' : `${n > 0 ? '+' : '−'}${Math.abs(n) >= 1000 ? `${(Math.abs(n) / 1000).toFixed(1)}k` : Math.abs(n)}`);

/** Where a tier sorts: highest first, and UNKNOWN (players no ladder or lookup placed, ADR-105) last. */
const tierOrder = (tier) => (TIERS.includes(tier) ? TIERS.indexOf(tier) : TIERS.length);

/** Analytics stat rows, highest tier first, and the rows summed over tiers (pickRate is per tier, so not summed). */
function tierRows(stats) {
  const rows = [...(stats ?? [])].sort((a, b) => tierOrder(a.tier) - tierOrder(b.tier));
  const games = rows.reduce((n, r) => n + r.games, 0);
  const wins = rows.reduce((n, r) => n + r.wins, 0);
  return { rows, all: { games, wins, winRate: games ? wins / games : null } };
}

/** Data Dragon's runesReforged.json as `{ id: { name, icon } }`, for styles and runes alike. */
function runeIndex(doc) {
  const out = {};
  for (const style of Array.isArray(doc) ? doc : []) {
    out[style.id] = { name: style.name, icon: style.icon };
    for (const slot of style.slots ?? []) for (const r of slot.runes ?? []) out[r.id] = { name: r.name, icon: r.icon };
  }
  return out;
}

/** A player's keystone and secondary style, from Riot's match-v5 `perks` or the proxy's summary of it. */
function runePair(p) {
  const k = p?.perks;
  if (!k) return { keystone: null, subStyle: null };
  if (Array.isArray(k.styles)) {
    const primary = k.styles.find((s) => s.description === 'primaryStyle') ?? k.styles[0];
    const sub = k.styles.find((s) => s.description === 'subStyle') ?? k.styles[1];
    return { keystone: primary?.selections?.[0]?.perk ?? null, subStyle: sub?.style ?? null };
  }
  return { keystone: k.keystone ?? null, subStyle: k.subStyle ?? null };
}

/** Data Dragon's item.json as `{ id: name }`. */
function itemIndex(doc) {
  return Object.fromEntries(Object.entries(doc?.data ?? {}).map(([id, it]) => [Number(id), it.name]));
}
/** The ids of the items Data Dragon's item.json tags "Boots". */
function bootsIndex(doc) {
  return new Set(Object.entries(doc?.data ?? {}).filter(([, it]) => it.tags?.includes('Boots')).map(([id]) => Number(id)));
}

// Every build in the same 4 × 2 shape (DEV-31): the inventory (item0–5) in cells 1–3 and 5–7, closed up so a sold or
// unbought item leaves no hole (DEV-30), the trinket (item6) in cell 4 and the boots in cell 8. A bot laner who finished
// the role quest has their boots in the role quest slot (`roleBoundItem`, SITE-06); other roles' quest rewards are not
// shown. `boots` is bootsIndex's set; without it the boots stay in the inventory and cell 8 is empty.
function itemSlots(p, boots) {
  const inv = [p.item0, p.item1, p.item2, p.item3, p.item4, p.item5].filter(Boolean);
  let shoes = p.teamPosition === 'BOTTOM' && p.roleBoundItem ? p.roleBoundItem : 0;
  const at = shoes ? -1 : inv.findIndex((id) => boots?.has(id));
  if (at >= 0) shoes = inv.splice(at, 1)[0];
  const [a = 0, b = 0, c = 0, d = 0, e = 0, f = 0] = inv;
  return [a, b, c, p.item6 ?? 0, d, e, f, shoes];
}

/** The lanes a matchup list covers, in Riot's teamPosition order. */
const ROLES = ['TOP', 'JUNGLE', 'MIDDLE', 'BOTTOM', 'UTILITY'];
const roleList = (matchups) => ROLES.filter((r) => (matchups ?? []).some((m) => m.role === r));
/** The patch picker (DEV-21): every patch summed first, then each patch the ladder has analytics for, newest first. */
function patchChoices(patches) {
  const list = patches ?? [];
  const total = list.reduce((n, p) => n + (p.games ?? 0), 0);
  return [['all', `All patches · ${total.toLocaleString()} games`], ...list.map((p) => [p.patch, `${p.patch} · ${(p.games ?? 0).toLocaleString()} games`])];
}

/** The patch to read: the one picked while the list still has it, else every patch. */
const pickPatch = (picked, patches) => (picked !== 'all' && (patches ?? []).some((p) => p.patch === picked) ? picked : 'all');

const patchLabel = (p) => (p === 'all' ? 'all patches' : `patch ${p}`);

// One player's build on the match page (BLD-04), worked out from the timeline the page already
// fetches. The rules are BLD's (IMPLEMENTATION.md §Post-release — BLD), the same as
// src/archive/builds.rs, and both are held to tests/fixtures/builds/*.expected.json.
/** Purchases before this many ms into the game are the starter. */
const BUILD_STARTER_MS = 60_000;
/** A finished item costs at least this much in total. */
const FINISHED_MIN_GOLD = 1500;
/** Base Boots, which aren't a player's boots choice. */
const BASE_BOOTS = 1001;
/** At most this many finished items are kept: an inventory's six slots. */
const ITEMS_KEPT = 6;
/** Level-ups kept in `skills`, as `"QWEQQRQ…"`. */
const SKILLS_KEPT = 15;
/** `SKILL_LEVEL_UP.skillSlot` 1–4. */
const SKILL_KEYS = ['Q', 'W', 'E', 'R'];
/**
 * Purchases less than this far apart are one shop visit. A display choice, not Riot's: the
 * timeline has no event for opening or closing the shop.
 */
const SHOP_VISIT_GAP_MS = 30_000;

/**
 * Data Dragon's item.json as a build reads it: `Map(id → { finished, bootsTag, trinket, from })`.
 * Finished: purchasable, builds into nothing, at least 1500 gold, and not tagged Boots,
 * Consumable or Trinket. An entry whose id isn't a number is left out.
 */
function itemCatalog(doc) {
  const out = new Map();
  for (const [key, e] of Object.entries(doc?.data ?? {})) {
    if (!/^-?\d+$/.test(key) || !e || typeof e !== 'object') continue;
    const tags = Array.isArray(e.tags) ? e.tags : [];
    const tagged = (t) => tags.includes(t);
    const gold = e.gold ?? {};
    out.set(Number(key), {
      finished: gold.purchasable === true && !(e.into ?? []).length && (gold.total ?? 0) >= FINISHED_MIN_GOLD
        && !tagged('Boots') && !tagged('Consumable') && !tagged('Trinket'),
      bootsTag: tagged('Boots'),
      trinket: tagged('Trinket'),
      from: (Array.isArray(e.from) ? e.from : []).filter((f) => /^-?\d+$/.test(f)).map(Number),
    });
  }
  return out;
}

/**
 * Boots: tagged Boots other than base Boots, or built from such an item. The second rule
 * catches upgrades with no Boots tag, such as Gunmetal Greaves (3172).
 */
function isBoots(catalog, id) {
  const tagged = (x) => x !== BASE_BOOTS && Boolean(catalog.get(x)?.bootsTag);
  return tagged(id) || (catalog.get(id)?.from ?? []).some(tagged);
}

/** Q, W and E ranked by points at the end, a tie going to the one that reached its count first. */
function skillOrder(slots) {
  if (!slots.length) return null;
  const points = [0, 0, 0];
  const reached = [Infinity, Infinity, Infinity];
  slots.forEach((s, k) => { if (s < 3) { points[s] += 1; reached[s] = k; } });
  return [0, 1, 2].sort((a, b) => points[b] - points[a] || reached[a] - reached[b]).map((s) => SKILL_KEYS[s]).join('');
}

/**
 * One player's build from a match-v5 timeline: `{ purchases, starter, boots, items, skills,
 * skillOrder, levelUps }`, times in ms. The player is found through the timeline's own
 * `info.participants` (puuid → participantId); events of `participantId: 0` are not a player's.
 * Purchases are ITEM_PURCHASED in time order minus undone purchases (an ITEM_UNDO with
 * `afterId: 0` removes the latest earlier purchase of `beforeId`); sales and their undos are
 * ignored. Only NORMAL level-ups count. Without a catalogue, `starter`, `boots` and `items` are
 * `null`; with one, an item it doesn't know is dropped from them, not guessed. Never throws: a
 * strange timeline gives an empty build.
 */
function playerBuild(timeline, puuid, catalog) {
  const info = timeline?.info;
  const parts = Array.isArray(info?.participants) ? info.participants : [];
  const pid = puuid ? parts.find((p) => p?.puuid === puuid && Number.isInteger(p.participantId) && p.participantId !== 0)?.participantId : null;
  const frames = Array.isArray(info?.frames) ? info.frames : [];
  const events = !pid ? [] : frames
    .flatMap((f) => (Array.isArray(f?.events) ? f.events : []))
    .filter((e) => e?.participantId === pid)
    .sort((a, b) => (a.timestamp ?? 0) - (b.timestamp ?? 0));
  const purchases = [];
  for (const e of events) {
    const t = e.timestamp ?? 0;
    if (e.type === 'ITEM_PURCHASED' && Number.isInteger(e.itemId)) purchases.push({ itemId: e.itemId, t });
    if (e.type === 'ITEM_UNDO' && e.afterId === 0 && e.beforeId) {
      for (let k = purchases.length - 1; k >= 0; k--) {
        if (purchases[k].itemId === e.beforeId && purchases[k].t <= t) { purchases.splice(k, 1); break; }
      }
    }
  }
  const levelUps = events
    .filter((e) => e.type === 'SKILL_LEVEL_UP' && e.levelUpType === 'NORMAL' && e.skillSlot >= 1 && e.skillSlot <= 4)
    .map((e) => ({ slot: e.skillSlot, t: e.timestamp ?? 0 }));
  const slots = levelUps.map((l) => l.slot - 1);
  const known = catalog ? purchases.filter((p) => catalog.has(p.itemId)) : [];
  return {
    purchases,
    starter: catalog ? known.filter((p) => p.t < BUILD_STARTER_MS && !catalog.get(p.itemId).trinket).map((p) => p.itemId).sort((a, b) => a - b) : null,
    boots: catalog ? (known.find((p) => isBoots(catalog, p.itemId))?.itemId ?? null) : null,
    items: catalog ? known.filter((p) => catalog.get(p.itemId).finished).slice(0, ITEMS_KEPT) : null,
    skills: slots.slice(0, SKILLS_KEPT).map((s) => SKILL_KEYS[s]).join(''),
    skillOrder: skillOrder(slots),
    levelUps,
  };
}

/** Purchases grouped into shop visits: each next purchase less than SHOP_VISIT_GAP_MS after the last joins it. */
function shopVisits(purchases) {
  const out = [];
  for (const p of purchases ?? []) {
    const last = out[out.length - 1];
    if (last && p.t - last.last < SHOP_VISIT_GAP_MS) { last.items.push(p.itemId); last.last = p.t; } else out.push({ t: p.t, items: [p.itemId], last: p.t });
  }
  return out.map(({ t, items }) => ({ t, items }));
}

// ---------- end pure helpers

const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// The key is shared with /dev, which stores it JSON-encoded.
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};

let cfg = { authDisabled: false, platforms: [] };
let version = null;
let champions = {};
const names = new Map(); // puuid → account, for the session
const calls = [];
// patch: the analytics patch, `all` or a `major.minor` (DEV-21). region: the champion view's
// platform, '' for every platform; null follows the platform picked above.
const state = { tier: 'CHALLENGER', queue: 'RANKED_SOLO_5x5', page: 0, ladder: null, ladderFor: '', patch: 'all', region: null };

/** One GET through the proxy, logged in the calls drawer. */
async function get(path) {
  const headers = {};
  const key = $('#key').value.trim();
  if (key && !cfg.authDisabled) headers.Authorization = `Bearer ${key}`;
  const t0 = performance.now();
  const c = { path, status: 0, ms: 0, cache: '' };
  let json;
  try {
    // Revalidate every call: the analytics routes send `max-age=300`, and a recompute
    // would otherwise stay hidden behind the browser's copy for five minutes (DEV-24).
    const r = await fetch(path, { headers, cache: 'no-cache' });
    c.status = r.status;
    c.cache = r.headers.get('x-cache') ?? '';
    const text = await r.text();
    try { json = JSON.parse(text); } catch { json = undefined; }
  } catch { /* network error: status 0 */ }
  c.ms = Math.round(performance.now() - t0);
  calls.unshift(c);
  renderCalls();
  return { ok: c.status >= 200 && c.status < 300, status: c.status, json };
}

function renderCalls() {
  $('#calls summary').textContent = `API calls (${calls.length})`;
  $('#calls tbody').innerHTML = calls.slice(0, 200).map((c) =>
    `<tr><td class="s${String(c.status)[0]}">${c.status || 'ERR'}</td><td class="n">${c.ms} ms</td><td>${esc(c.cache)}</td><td>GET ${esc(c.path)}</td></tr>`).join('');
}

/** The "how this was built" chips under a card's title. */
const sources = (...ops) => ops.map((op) => `<a class="src" href="${esc(explorerLink(op))}" title="${esc(op)}: open in the dev explorer">${esc(op)}</a>`).join('');

function failure(res) {
  if (res.status === 401 || res.status === 403) return `<p class="err">This call needs a key with read scope. Paste one above.</p>`;
  const e = res.json?.error;
  return `<p class="err">${res.status || 'network error'}${e ? ` · ${esc(e.code)}: ${esc(e.message)}` : ''}</p>`;
}

function champIcon(id, cls = '') {
  const c = champions[id];
  const url = imageUrl(version, 'champion', c?.image);
  const label = c?.name ?? `#${id}`;
  return url ? `<img class="icon ${cls}" src="${esc(url)}" alt="${esc(label)}" data-short="${esc(label.slice(0, 2))}" loading="lazy">` : `<span class="icon ${cls}">${esc(label.slice(0, 2))}</span>`;
}

  loadStatus();
  loadLadder();
  loadRotation();
  loadTop();
}

async function loadStatus() {
  const res = await get(`/v1/lol/status/${platform()}`);
  if (!res.ok) return;
  const notices = statusNotices(res.json, navigator.language?.replace('-', '_'));
  $('#status').innerHTML = notices.map((n) =>
    `<div class="banner ${n.severity === 'critical' ? 'critical' : ''}"><b>${esc(n.kind)}</b>${esc(n.title)} ${sources('GET /v1/lol/status/{platform}')}</div>`).join('');
}

async function loadLadder() {
  const key = `${platform()}/${state.tier}/${state.queue}`;
  const el = $('#ladder');
  el.innerHTML = ladderHeader() + `<p class="muted">loading…</p>`;
  if (state.ladderFor !== key) {
    const res = await get(`/v1/lol/league/apex/${platform()}/${state.tier}/${state.queue}`);
    if (!res.ok) { el.innerHTML = ladderHeader() + failure(res); return; }
    state.ladder = sortLadder(res.json?.entries);
    state.ladderFor = key;
    state.page = 0;
  }
  renderLadder();
}

function ladderHeader() {
  const tiers = APEX.map((t) => `<button data-tier="${t}" class="${t === state.tier ? 'on' : ''}">${titleCase(t)}</button>`).join('');
  const queues = QUEUES.map(([q, l]) => `<button data-queue="${q}" class="${q === state.queue ? 'on' : ''}">${l}</button>`).join('');
  return `<header><h2>Ladder</h2><span class="tier" style="background:${tierColour(state.tier)}">${state.tier}</span><div class="tools">${tiers}<span style="width:8px"></span>${queues}</div></header>
  <div>${sources('GET /v1/lol/league/apex/{platform}/{tier}/{queue}', 'GET /v1/riot/accounts/by-puuid/{puuid}')}</div>`;
}

function renderLadder() {
  const el = $('#ladder');
  const { page, pages, rows } = ladderPage(state.ladder, state.page);
  if (!rows.length) { el.innerHTML = ladderHeader() + `<p class="empty">Nobody in this league yet.</p>`; return; }
  el.innerHTML = ladderHeader() + `<table><thead><tr><th class="n">#</th><th>Player</th><th class="n">LP</th><th class="n hide-sm">W / L</th><th>Win rate</th></tr></thead><tbody>${rows.map((e) => {
    const a = names.get(e.puuid);
    const wr = winRate(e.wins, e.losses);
    const href = a ? `#/player/${encodeURIComponent(a.gameName)}/${encodeURIComponent(a.tagLine)}` : '';
    return `<tr data-puuid="${esc(e.puuid)}" ${href ? `data-href="${esc(href)}"` : ''}>
      <td class="n">${e.position}</td>
      <td class="name">${a ? `${esc(a.gameName)} <small>#${esc(a.tagLine)}</small>` : '<span class="muted">…</span>'}${e.hotStreak ? '<span class="flag hot" title="hotStreak">hot</span>' : ''}${e.veteran ? '<span class="flag" title="veteran">vet</span>' : ''}</td>
      <td class="n">${e.leaguePoints.toLocaleString()}</td>
      <td class="n hide-sm">${e.wins} / ${e.losses}</td>
      <td><span class="wr"><span class="bar"><i style="width:${(wr ?? 0) * 100}%"></i></span>${pct(wr)}</span></td></tr>`;
  }).join('')}</tbody></table>
  <div class="pager"><button data-page="-1" ${page === 0 ? 'disabled' : ''}>Prev</button><span>page ${page + 1} of ${pages} · ${state.ladder.length} players</span><button data-page="1" ${page >= pages - 1 ? 'disabled' : ''}>Next</button></div>`;
  const capped = apexCapNote(state.tier, state.ladder.length);
  if (capped) el.insertAdjacentHTML('beforeend', `<p class="cap-note" title="Riot's league endpoint lists only the top of this tier; the players below it are missing here">${esc(capped)}</p>`);
  fillNames(rows);
}

/** Names for the visible page only, five at a time, cached for the session. */
async function fillNames(rows) {
  const todo = rows.filter((e) => e.puuid && !names.has(e.puuid));
  const shown = state.ladderFor + state.page;
  for (let i = 0; i < todo.length; i += 5) {
    await Promise.all(todo.slice(i, i + 5).map(async (e) => {
      const res = await get(`/v1/riot/accounts/by-puuid/${encodeURIComponent(e.puuid)}`);
      if (res.ok && res.json?.gameName) names.set(e.puuid, res.json);
    }));
    if (state.ladderFor + state.page !== shown || !$('#ladder')) return;
    renderLadderNames();
  }
}

function renderLadderNames() {
  for (const tr of document.querySelectorAll('#ladder tbody tr')) {
    const a = names.get(tr.dataset.puuid);
    if (!a || tr.dataset.href) continue;
    tr.dataset.href = `#/player/${encodeURIComponent(a.gameName)}/${encodeURIComponent(a.tagLine)}`;
    $('td.name', tr).firstChild.replaceWith(document.createRange().createContextualFragment(`${esc(a.gameName)} <small>#${esc(a.tagLine)}</small>`));
  }
}

async function loadRotation() {
  const el = $('#rotation');
  const head = `<header><h2>Free champion rotation</h2></header><div>${sources('GET /v1/lol/rotations/{platform}', 'GET /v1/static/{file}')}</div>`;
  const res = await get(`/v1/lol/rotations/${platform()}`);
  if (!res.ok) { el.innerHTML = head + failure(res); return; }
  const ids = res.json?.freeChampionIds ?? [];
  el.innerHTML = head + (ids.length
    ? `<div class="icons" style="margin-top:8px">${ids.map((id) => `<a class="champ" href="#/champion/${id}">${champIcon(id)}${esc(champions[id]?.name ?? `#${id}`)}</a>`).join('')}</div>`
    : `<p class="empty">No rotation published.</p>`);
}

/** The patches a ladder has analytics for, with one champion's games when given one (DEV-25);
 * [] when the call fails, so the page still reads every patch. */
async function patchList(platformId, championId) {
  const q = new URLSearchParams({ queue: state.queue });
  if (platformId) q.set('platform', platformId);
  if (championId) q.set('championId', String(championId));
  const res = await get(`/v1/lol/analytics/patches?${q}`);
  return res.ok ? res.json?.patches ?? [] : [];
}

const patchSelect = (patches) => `<select data-patch aria-label="patch">${patchChoices(patches).map(([v, l]) => `<option value="${esc(v)}" ${v === state.patch ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;

async function loadTop() {
  const el = $('#top');
  const patches = await patchList(platform());
  state.patch = pickPatch(state.patch, patches);
  const head = `<header><h2>Top champions</h2><span class="muted" id="topMeta"></span><div class="tools">${patchSelect(patches)}</div></header><div>${sources('GET /v1/lol/analytics/champions', 'GET /v1/lol/analytics/patches')}</div>`;
  const q = new URLSearchParams({ platform: platform(), queue: state.queue, patch: state.patch, limit: '500' });
  const res = await get(`/v1/lol/analytics/champions?${q}`);
  if (!res.ok) { el.innerHTML = head + failure(res); return; }
  const top = topChampions(res.json?.champions);
  if (!top.played.length) {
    el.innerHTML = head + (patches.length
      ? `<p class="empty">No champion has enough games on ${esc(patchLabel(state.patch))} yet.</p>`
      : `<p class="empty">No analytics yet: they fill in when a ladder crawl for this platform completes.</p>`);
    return;
  }
  const list = (rows, stat) => `<ol>${rows.map((c) => `<li><a href="#/champion/${c.championId}">${champIcon(c.championId, 'sm')}</a><a href="#/champion/${c.championId}">${esc(champions[c.championId]?.name ?? c.championName ?? `#${c.championId}`)}</a><span class="stat">${stat(c)}</span></li>`).join('')}</ol>`;
  el.innerHTML = head + `<div class="cols top">
    <div><h3 class="muted" style="font-size:12px;margin:8px 0 2px">Highest win rate</h3>${list(top.winRate, (c) => `${pct(c.winRate)}<small>${c.games} games</small>`)}</div>
    <div><h3 class="muted" style="font-size:12px;margin:8px 0 2px">Most played</h3>${list(top.played, (c) => `${c.games}<small>${pct(c.winRate)} win</small>`)}</div>
  </div>`;
  $('#topMeta', el).textContent = `${patchLabel(state.patch)} · ${QUEUES.find(([q]) => q === state.queue)?.[1]}`;
}

// ---------- player (DEV-07)
const OP = {
  profile: 'GET /v1/players/by-riot-id/{gameName}/{tagLine}/profile',
  matches: 'GET /v1/players/{puuid}/matches',
  pool: 'GET /v1/players/{puuid}/champions',
  mastery: 'GET /v1/lol/mastery/by-puuid/{platform}/{puuid}',
  live: 'GET /v1/lol/spectator/active/{platform}/{puuid}',
  queues: 'GET /v1/static/queues',
  file: 'GET /v1/static/{file}',
};
const MATCH_PAGE = 10;
const MASTERY_SHOWN = 12;
let queues = null; // queueId → description, once per session
let spells = null; // summoner spell key → image file, once per session
let runes = null; // rune and style id → { name, icon }, once per session
let itemNames = null; // item id → name, once per session
let boots = null; // ids of the items Data Dragon tags "Boots", once per session
let catalog = null; // item.json as a build reads it (BLD-04), once per session
// Bumped on every route, so a slow call for a view the user already left draws nothing.
let viewSeq = 0;
const pl = { id: null, profile: null, queue: 0, champion: 0, start: 0, matches: [], hasMore: false, mastery: null, masteryAll: false };

async function loadLookups() {
  const [q, s, r, i] = await Promise.all([
    queues ? null : get('/v1/static/queues'),
    spells ? null : get('/v1/static/summoner'),
    runes ? null : get('/v1/static/runes'),
    itemNames ? null : get('/v1/static/item'),
  ]);
  if (q?.ok) queues = queueNames(q.json);
  if (s?.ok) spells = spellIndex(s.json);
  if (r?.ok) runes = runeIndex(r.json);
  if (i?.ok) [itemNames, boots, catalog] = [itemIndex(i.json), bootsIndex(i.json), itemCatalog(i.json)];
}

// Riot's descriptions read "5v5 Ranked Solo games"; as a label the last word adds nothing.
const queueName = (id) => (id == null ? '' : queues?.[id]?.replace(/\s+games$/i, '') ?? `queue ${id}`);
const spellIcon = (id) => {
  const url = imageUrl(version, 'spell', spells?.[id]);
  return url ? `<img class="icon xs" src="${esc(url)}" alt="spell ${esc(id)}" loading="lazy">` : `<span class="icon xs"></span>`;
};
const itemIcon = (id) => {
  const url = id ? imageUrl(version, 'item', `${id}.png`) : null;
  return url ? `<img class="icon xs" src="${esc(url)}" alt="item ${esc(id)}" loading="lazy">` : `<span class="icon xs"></span>`;
};
const runeIcon = (id) => {
  const name = runes?.[id]?.name ?? (id ? `rune ${id}` : '');
  const url = runeUrl(version, runes?.[id]?.icon);
  return url ? `<img class="icon xs rune" src="${esc(url)}" alt="${esc(name)}" title="${esc(name)}" loading="lazy">` : `<span class="icon xs rune" title="${esc(name)}"></span>`;
};
// Keystone over secondary style, beside the spells, as the client shows them.
const runeIcons = (p) => {
  const { keystone, subStyle } = runePair(p);
  return keystone || subStyle ? `<span class="spells runes">${runeIcon(keystone)}${runeIcon(subStyle)}</span>` : '';
};
// The champion's level sits on its portrait, as in the client's scoreboard.
const portrait = (id, level, cls = '') => `<span class="portrait">${champLink(id, cls)}${level != null ? `<span class="lvl" title="champion level">${esc(level)}</span>` : ''}</span>`;
const champLink = (id, cls = '') => `<a href="#/champion/${esc(id)}" title="${esc(champions[id]?.name ?? `#${id}`)}">${champIcon(id, cls)}</a>`;

async function renderPlayer({ gameName, tagLine }, refresh = false) {
  const seq = ++viewSeq;
  const alive = () => seq === viewSeq;
  if (!platform()) {
    $('#view').innerHTML = `<div class="card empty">Pick the platform ${esc(gameName)} #${esc(tagLine)} plays on above.</div>`;
    return;
  }
  if (!refresh) {
    Object.assign(pl, { id: `${platform()}/${gameName}#${tagLine}`, profile: null, queue: 0, champion: 0, start: 0, matches: [], hasMore: false, mastery: null, masteryAll: false });
    $('#view').innerHTML = `<section class="card profile" id="pHead"><p class="muted">Looking up ${esc(gameName)} #${esc(tagLine)}…</p></section>`;
  }
  const q = new URLSearchParams({ platform: platform(), topMastery: '3' });
  if (refresh) q.set('refresh', 'true');
  const [res] = await Promise.all([get(`/v1/players/by-riot-id/${encodeURIComponent(gameName)}/${encodeURIComponent(tagLine)}/profile?${q}`), loadLookups()]);
  if (!alive()) return;
  if (!res.ok) {
    $('#pHead').innerHTML = res.status === 404
      ? `<p class="err">No player ${esc(gameName)} #${esc(tagLine)}.</p><p class="muted">Check the spelling and the tag. <a href="#/">Back to the home view</a></p>`
      : failure(res);
    return;
  }
  pl.profile = res.json;
  $('#view').innerHTML = `<section class="card profile" id="pHead"></section>
  <div id="pLive"></div>
  <div class="grid">
    <div><section class="card" id="pMatches"></section></div>
    <div>
      <section class="card" id="pRanks"></section>
      <section class="card" id="pPool"></section>
      <section class="card" id="pMastery"></section>
    </div>
  </div>`;
  renderProfile();
  renderRanks();
  loadLive(seq);
  loadMatches(seq, refresh);
  loadPool(seq);
  loadMastery(seq);
}

function renderProfile() {
  const p = pl.profile;
  const icon = imageUrl(version, 'profileicon', p.summoner?.profileIconId != null ? `${p.summoner.profileIconId}.png` : null);
  const wait = p.refreshAvailableIn ?? 0;
  const top = Array.isArray(p.mastery) ? p.mastery : [];
  $('#pHead').innerHTML = `<div class="who">
    ${icon ? `<img class="avatar" src="${esc(icon)}" alt="profile icon">` : '<span class="avatar"></span>'}
    <div>
      <h2>${esc(p.account?.gameName ?? '?')} <span class="muted">#${esc(p.account?.tagLine ?? '')}</span></h2>
      <div class="muted">${p.summoner?.summonerLevel != null ? `Level ${esc(p.summoner.summonerLevel)} · ` : ''}${esc(p.platform)} · ${esc(p.region)}</div>
      <div>${sources(OP.profile, OP.file)}</div>
    </div>
    ${top.length ? `<div class="mains"><span class="muted">Top mastery</span>${top.map((m) => champLink(m.championId)).join('')}</div>` : ''}
    <div class="tools"><button data-refresh ${wait > 0 ? `disabled title="available again in ${esc(wait)} s"` : 'title="re-read every part upstream (metered: once a minute)"'}>${p.refreshed ? 'Refreshed' : 'Refresh'}</button></div>
  </div>${p.warnings?.length ? `<p class="err">Partly loaded: ${esc(p.warnings.join('; '))}</p>` : ''}`;
}

function renderRanks() {
  const league = pl.profile.league;
  const body = league == null
    ? `<p class="muted">Ranked entries could not be fetched (see the warning above).</p>`
    : `<div class="ranks">${rankCards(league).map(({ label, entry: e }) => {
      const wr = e ? winRate(e.wins, e.losses) : null;
      return `<div class="rank" style="--tc:${tierColour(e?.tier)}">
        <small class="muted">${esc(label)}</small>
        <b>${esc(rankLabel(e))}</b>
        ${e ? `<span>${esc(e.leaguePoints)} LP${e.hotStreak ? '<span class="flag hot">hot</span>' : ''}</span>
        <small class="muted">${esc(e.wins)}W ${esc(e.losses)}L · ${pct(wr)}</small>` : '<small class="muted">no placement this season</small>'}
      </div>`;
    }).join('')}</div>`;
  $('#pRanks').innerHTML = `<header><h2>Ranked</h2></header><div>${sources(OP.profile)}</div>${body}`;
}

async function loadLive(seq) {
  const p = pl.profile;
  const res = await get(`/v1/lol/spectator/active/${platform()}/${encodeURIComponent(p.puuid)}`);
  // Not in a game is a 404 (spectator-v5); nothing to show then.
  if (seq !== viewSeq || !res.ok) return;
  const g = liveGame(res.json, p.puuid);
  $('#pLive').innerHTML = `<div class="banner live"><b>Live now</b>${g.me ? champLink(g.me.championId, 'sm') : ''}
    ${esc(queueName(g.queueId) || g.mode)} · ${clock(g.secs)}
    <span class="teams">${g.teams.map((t) => `<span class="team">${t.players.map((x) => `<span class="${x.me ? 'me' : ''}">${champLink(x.championId, 'sm')}</span>`).join('')}</span>`).join('<span class="muted">vs</span>')}</span>
    ${sources(OP.live)}</div>`;
}

function matchesHeader() {
  const tabs = [[0, 'All'], ...QUEUES.map(([, label, id]) => [id, label])]
    .map(([id, label]) => `<button data-mqueue="${id}" class="${id === pl.queue ? 'on' : ''}">${esc(label)}</button>`).join('');
  // SITE-02: a champion picked in the pool narrows the history to its games.
  const only = pl.champion ? `<button data-mchamp="0" class="on" title="show every champion">${esc(champions[pl.champion]?.name ?? `#${pl.champion}`)} ✕</button>` : '';
  return `<header><h2>Match history</h2><div class="tools">${only}${tabs}</div></header><div>${sources(OP.matches, OP.queues, OP.file)}</div>`;
}

async function loadMatches(seq, refresh = false, more = false) {
  const el = $('#pMatches');
  const p = pl.profile;
  if (!more) {
    pl.start = 0;
    pl.matches = [];
    el.innerHTML = matchesHeader() + `<p class="muted">loading…</p>`;
  }
  const q = new URLSearchParams({ platform: platform(), start: String(pl.start), count: String(MATCH_PAGE) });
  if (pl.queue) q.set('queue', String(pl.queue));
  if (pl.champion) q.set('champion', String(pl.champion));
  if (refresh) q.set('refresh', 'true');
  const res = await get(`/v1/players/${encodeURIComponent(p.puuid)}/matches?${q}`);
  if (seq !== viewSeq) return;
  if (!res.ok) { el.innerHTML = matchesHeader() + failure(res); return; }
  pl.matches.push(...(res.json.matches ?? []));
  pl.start += MATCH_PAGE;
  pl.hasMore = Boolean(res.json.hasMore);
  pl.region = res.json.region;
  const bf = res.json.backfill;
  const note = bf ? `<p class="muted">This lookup queued the player's history for archiving (${esc(bf.status)}); the champion pool fills in as it runs.</p>` : '';
  // A filtered page comes from the archive, which may not reach back to the player's first game yet.
  const partial = res.json.archive && !res.json.archive.complete ? `<p class="muted">Only games archived so far: older ones appear as the player's history is archived.</p>` : '';
  const warn = res.json.warnings?.length ? `<p class="err">${esc(res.json.warnings.length)} match${res.json.warnings.length === 1 ? '' : 'es'} could not be loaded.</p>` : '';
  el.innerHTML = matchesHeader() + (pl.matches.length
    ? `<div class="matches">${pl.matches.map(matchCard).join('')}</div>`
    : `<p class="empty">No ${pl.queue ? `${esc(queueName(pl.queue))} ` : ''}games found.</p>`)
    + partial + warn + note + (pl.hasMore ? `<div class="pager"><button data-more>Load ${MATCH_PAGE} more</button></div>` : '');
}

function matchCard(m) {
  const p = m.player ?? {};
  const o = outcome(p);
  const secs = durationSecs(m);
  const cs = (p.totalMinionsKilled ?? 0) + (p.neutralMinionsKilled ?? 0);
  const items = itemSlots(p, boots);
  return `<article class="match ${o.kind}" data-match="${esc(m.matchId)}" data-href="${esc(matchHref(pl.region, m.matchId))}" title="open the scoreboard">
    <div class="meta"><b>${esc(o.label)}</b><span>${esc(queueName(m.queueId) || m.gameMode || '')}</span><span class="muted">${esc(ago(m.gameEndTimestamp ?? m.gameCreation))} · ${clock(secs)}</span></div>
    <div class="pick">${portrait(p.championId, p.champLevel)}<span class="spells">${spellIcon(p.summoner1Id)}${spellIcon(p.summoner2Id)}</span>${runeIcons(p)}</div>
    <div class="kda"><b>${esc(p.kills ?? 0)} / <span class="d">${esc(p.deaths ?? 0)}</span> / ${esc(p.assists ?? 0)}</b><small class="muted">${kda(p.kills, p.deaths, p.assists).toFixed(2)} KDA</small></div>
    <div class="cs hide-sm"><span>${cs} CS${secs ? ` <small class="muted">${(cs / (secs / 60)).toFixed(1)}/min</small>` : ''}</span><small class="muted">${thousands(p.goldEarned)} gold · ${thousands(p.totalDamageDealtToChampions)} dmg</small></div>
    <div class="items">${items.map(itemIcon).join('')}</div>
  </article>`;
}

async function loadPool(seq) {
  const el = $('#pPool');
  const head = `<header><h2>Champion pool</h2><span class="muted" id="poolMeta"></span></header><div>${sources(OP.pool)}</div>`;
  el.innerHTML = head + `<p class="muted">loading…</p>`;
  const q = new URLSearchParams({ platform: platform(), limit: '10' });
  if (pl.queue) q.set('queue', String(pl.queue));
  const res = await get(`/v1/players/${encodeURIComponent(pl.profile.puuid)}/champions?${q}`);
  if (seq !== viewSeq) return;
  if (!res.ok) { el.innerHTML = head + failure(res); return; }
  const rows = res.json.champions ?? [];
  el.innerHTML = head + (rows.length
    ? `<table><thead><tr><th>Champion</th><th class="n">Games</th><th>Win rate</th><th class="n">KDA</th><th class="n hide-sm">CS/min</th></tr></thead><tbody>${rows.map((c) => `<tr data-mchamp="${esc(c.championId)}" class="${c.championId === pl.champion ? 'on' : ''}" title="show only these games in the match history">
      <td class="name">${champLink(c.championId, 'sm')} ${esc(champions[c.championId]?.name ?? c.championName ?? `#${c.championId}`)}</td>
      <td class="n">${esc(c.games)}</td>
      <td><span class="wr"><span class="bar"><i style="width:${(c.winRate ?? 0) * 100}%"></i></span>${pct(c.winRate)}</span></td>
      <td class="n">${c.avgKda == null ? '–' : c.avgKda.toFixed(2)}</td>
      <td class="n hide-sm">${c.csPerMin == null ? '–' : c.csPerMin.toFixed(1)}</td></tr>`).join('')}</tbody></table>`
    : `<p class="empty">No archived games${pl.queue ? ` in ${esc(queueName(pl.queue))}` : ''} yet.</p>`);
  $('#poolMeta', el).textContent = `${res.json.archivedGames ?? 0} archived games`;
}

async function loadMastery(seq) {
  const el = $('#pMastery');
  const head = `<header><h2>Mastery</h2><span class="muted" id="mMeta"></span></header><div>${sources(OP.mastery)}</div>`;
  el.innerHTML = head + `<p class="muted">loading…</p>`;
  const res = await get(`/v1/lol/mastery/by-puuid/${platform()}/${encodeURIComponent(pl.profile.puuid)}`);
  if (seq !== viewSeq) return;
  if (!res.ok) { el.innerHTML = head + failure(res); return; }
  pl.mastery = masterySummary(res.json);
  renderMastery();
}

function renderMastery() {
  const el = $('#pMastery');
  const m = pl.mastery;

  const m = res.json;

    <div class="muted">${esc(new Date(info.gameCreation ?? 0).toLocaleString())} · ${clock(durationSecs(info))} · patch ${esc(String(info.gameVersion ?? '').split('.').slice(0, 2).join('.'))} · ${esc(m.metadata?.matchId ?? matchId)}</div>
    <div>${sources(OP.match, OP.timeline, OP.queues, OP.file)}</div>`;

/** The gold-difference graph: one diverging series around 0, blue side up, red side down. */
function renderGold(tl, match) {
  const el = $('#mGold');
  const head = `<header><h2>Gold difference</h2></header><div>${sources(OP.timeline)}</div>`;
  if (!tl.ok) { el.innerHTML = head + failure(tl); return; }
  const pts = goldDiff(tl.json, match);
  if (pts.length < 2) { el.innerHTML = head + `<p class="empty">No gold graph for this match: it needs two sides and a timeline.</p>`; return; }
  // Drawn at the card's own width, so text and strokes stay their CSS size; 720 when unmeasured.
  const W = Math.max(300, Math.round(el.clientWidth - 32) || 720), H = 220, L = 44, R = 14, T = 10, B = 22;
  const { max, step } = goldScale(pts);
  const last = pts[pts.length - 1].minute || 1;
  const x = (min) => L + (min / last) * (W - L - R);
  const y = (v) => T + ((max - v) / (2 * max)) * (H - T - B);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.minute).toFixed(1)},${y(p.diff).toFixed(1)}`).join('');
  const area = `${line}L${x(pts[pts.length - 1].minute).toFixed(1)},${y(0)}L${x(pts[0].minute).toFixed(1)},${y(0)}Z`;
  const yTicks = [];
  for (let v = -max; v <= max; v += step) yTicks.push(v);
  const xTicks = [];
  for (let mm = 0; mm <= last; mm += 5) xTicks.push(mm);
  el.innerHTML = head + `<div class="chart" id="goldChart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gold difference by minute, blue side minus red side" tabindex="0">
      <defs>
        <clipPath id="gUp"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath>
        <clipPath id="gDown"><rect x="0" y="${y(0)}" width="${W}" height="${H - y(0)}"/></clipPath>
      </defs>
      ${yTicks.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${signedGold(v)}</text>`).join('')}
      ${xTicks.map((mm) => `<text class="ax" x="${x(mm)}" y="${H - 6}" text-anchor="middle">${mm}′</text>`).join('')}
      <line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>
      <path class="area blue" d="${area}" clip-path="url(#gUp)"/><path class="area red" d="${area}" clip-path="url(#gDown)"/>
      <path class="line blue" d="${line}" clip-path="url(#gUp)"/><path class="line red" d="${line}" clip-path="url(#gDown)"/>
      <text class="lbl" x="${L + 6}" y="${T + 12}">Blue side ahead</text>
      <text class="lbl" x="${L + 6}" y="${H - B - 6}">Red side ahead</text>
      <line class="cross" id="gCross" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
      <circle class="dot" id="gDot" r="4" visibility="hidden"/>
    </svg>
    <div class="tip" id="gTip" hidden></div>
  </div>
  <details class="table-view"><summary class="muted">Show as a table</summary><table><thead><tr><th class="n">Minute</th><th class="n">Blue − red</th><th>Ahead</th></tr></thead><tbody>
    ${pts.map((p) => `<tr><td class="n">${p.minute}</td><td class="n">${p.diff.toLocaleString()}</td><td>${p.diff > 0 ? 'Blue side' : p.diff < 0 ? 'Red side' : 'Even'}</td></tr>`).join('')}</tbody></table></details>`;
  const svg = $('#goldChart svg');
  let at = pts.length - 1;
  const show = (i) => {
    at = Math.max(0, Math.min(pts.length - 1, i));
    const p = pts[at];
    const cx = x(p.minute), cy = y(p.diff);
    $('#gCross').setAttribute('x1', cx); $('#gCross').setAttribute('x2', cx); $('#gCross').setAttribute('visibility', 'visible');
    $('#gDot').setAttribute('cx', cx); $('#gDot').setAttribute('cy', cy); $('#gDot').setAttribute('visibility', 'visible');
    $('#gDot').setAttribute('class', `dot ${p.diff < 0 ? 'red' : 'blue'}`);
    const tip = $('#gTip');
    tip.replaceChildren();
    const v = document.createElement('b'); v.textContent = `${signedGold(p.diff)} gold`;
    const k = document.createElement('span'); k.textContent = `${p.minute} min · ${p.diff > 0 ? 'Blue side ahead' : p.diff < 0 ? 'Red side ahead' : 'even'}`;
    tip.append(v, k);
    tip.hidden = false;
    // Centred on the crosshair, but never past either edge of the chart.
    const box = $('#goldChart').clientWidth;
    const px = (cx / W) * box;
    tip.style.left = `${Math.max(0, Math.min(box - tip.offsetWidth, px - tip.offsetWidth / 2))}px`;
  };
  const hide = () => { $('#gTip').hidden = true; $('#gCross').setAttribute('visibility', 'hidden'); $('#gDot').setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointermove', (ev) => {
    const r = svg.getBoundingClientRect();
    const sx = ((ev.clientX - r.left) / (r.width || 1)) * W;
    const minute = ((sx - L) / (W - L - R)) * last;
    let best = 0;
    pts.forEach((p, i) => { if (Math.abs(p.minute - minute) < Math.abs(pts[best].minute - minute)) best = i; });
    show(best);
  });
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => show(at));
  svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowLeft') { show(at - 1); ev.preventDefault(); }
    if (ev.key === 'ArrowRight') { show(at + 1); ev.preventDefault(); }
  });
}

const regionSelect = () => `<select data-region aria-label="region"><option value="">All regions</option>${(cfg?.platforms ?? []).map((p) => `<option value="${esc(p.value)}" ${p.value === champRegion() ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}</select>`;

  const { rows, all } = tierRows(d.stats);

    ? `<p class="empty">Not enough ${esc(name)} games on ${esc(patchLabel(state.patch))}${region ? '' : ' in any region'} yet.</p>`
    : `<p class="empty">No ${esc(name)} games in the analytics yet: they fill in when a ladder crawl${region ? ' for this platform' : ''} completes.</p>`;
  const num = (v, f) => (v == null ? '–' : f(v));

    ? `<div class="scroll"><table><thead><tr><th>Tier</th><th class="n">Games</th><th>Win rate</th><th class="n">Pick</th><th class="n">Ban</th><th class="n hide-sm">KDA</th><th class="n hide-sm">CS/min</th><th class="n hide-sm">Gold/min</th></tr></thead><tbody>${rows.map((r) => `<tr>

const stat = (e) => `<span class="stat">${pct(e.winRate)}<small>${e.games.toLocaleString()} games</small></span>`;
const itemName = (id) => itemNames?.[id] ?? `item ${id}`;

const namedItem = (id) => `<span title="${esc(itemName(id))}">${itemIcon(id)}</span>`;

/** The set build tabs (BLD-03): up to three builds, each labelled by its two core items. */
function renderBuilds() {

  const tabs = builds.map((x, i) => `<button data-build="${i}" class="${i === ch.tab ? 'on' : ''}" title="${esc(x.core.map(itemName).join(' › '))}">${itemIcon(x.core[0])}${itemIcon(x.core[1])}${stat(x)}</button>`).join('');
  const group = (label, body) => `<span class="bgroup"><small>${label}</small>${body || '<span class="muted">–</span>'}</span>`;
  const rune = b.runes[0];
  const spell = b.spells[0];
  const order = b.skillOrder[0]?.order;
  const sep = '<span class="sep">›</span>';
  const step = (opts) => `<span class="step">${opts.length ? opts.map((o) => `<span class="opt">${namedItem(o.itemId)}<span>${pct(o.winRate)}<small class="muted"> · ${o.games.toLocaleString()}</small></span></span>`).join('') : '<span class="muted">–</span>'}</span>`;
  $('#cBuild').innerHTML = `<header><h2>Builds</h2><span class="muted">${role ? `${esc(titleCase(role))} · ` : ''}${pct(b.pickRate)} of ${ch.builds.totalGames.toLocaleString()} games with a build</span></header><div>${sources(OP.builds, OP.file)}</div>
    <div class="tools builds">${tabs}</div>
    <div class="brow">${[
      group('Runes', rune ? `<span class="spells-row">${runeIcon(rune.keystoneId)}${runeIcon(rune.subStyleId)}</span>` : ''),
      group('Spells', spell ? `<span class="spells-row">${spellIcon(spell.spellA)}${spellIcon(spell.spellB)}</span>` : ''),
      group('Skills', order ? esc([...order].join(' › ')) : ''),
      group('Starter', b.starter[0] ? `<span class="spells-row">${b.starter[0].items.map(namedItem).join('')}</span>` : ''),
      group('Boots', b.boots[0] ? namedItem(b.boots[0].itemId) : ''),
    ].join('')}</div>
    <div class="brow path">${namedItem(b.core[0])}${sep}${namedItem(b.core[1])}${b.next.map((opts) => sep + step(opts)).join('')}</div>`;
}

async function loadMatchups(seq) {
  const el = $('#cMatchups');
  const q = new URLSearchParams({ queue: state.queue, patch: state.patch, limit: '200' });
  if (champRegion()) q.set('platform', champRegion());
  const res = await get(`/v1/lol/analytics/champions/${ch.id}/matchups?${q}`);
  if (seq !== viewSeq) return;
  const head = (tabs = '') => `<header><h2>Matchups</h2><div class="tools">${tabs}</div></header><div>${sources(OP.matchups)}</div>`;
  if (!res.ok) { el.innerHTML = head() + failure(res); return; }
  ch.matchups = res.json.matchups ?? [];
  renderMatchups();
}

function renderMatchups() {
  const el = $('#cMatchups');
  const roles = roleList(ch.matchups);
  if (ch.role && !roles.includes(ch.role)) ch.role = '';
  const tabs = roles.length > 1 ? [['', 'All'], ...roles.map((r) => [r, titleCase(r)])].map(([r, l]) => `<button data-role="${r}" class="${r === ch.role ? 'on' : ''}">${l}</button>`).join('') : '';
  const rows = ch.matchups.filter((m) => !ch.role || m.role === ch.role).sort((a, b) => b.games - a.games || b.winRate - a.winRate);
  el.innerHTML = `<header><h2>Matchups</h2><div class="tools">${tabs}</div></header><div>${sources(OP.matchups)}</div>` + (rows.length
    ? `<p class="muted note">Win rate of ${esc(champions[ch.id]?.name ?? 'this champion')} against each lane opponent, most games first.</p>
      <div class="scroll tall"><table><thead><tr><th>Against</th><th>Lane</th><th class="n">Games</th><th>Win rate</th></tr></thead><tbody>${rows.map((m) => `<tr>
      <td class="name">${champLink(m.opponentId, 'sm')} ${esc(champions[m.opponentId]?.name ?? m.opponentName ?? `#${m.opponentId}`)}</td>
      <td>${esc(titleCase(m.role))}</td><td class="n">${m.games.toLocaleString()}</td>
      <td><span class="wr"><span class="bar"><i style="width:${(m.winRate ?? 0) * 100}%"></i></span>${pct(m.winRate)}</span></td></tr>`).join('')}</tbody></table></div>`
    : `<p class="empty">No lane matchups ${state.patch === 'all' ? 'archived yet' : `on ${esc(patchLabel(state.patch))}`}.</p>`);
}

function route() {
  const { view, args } = parseRoute(location.hash);
  if (view === 'player') return renderPlayer(args);
  if (view === 'champion') return renderChampion(args);
  if (view === 'match') return renderMatch(args);
  renderHome();
}

document.addEventListener('click', (ev) => {
  // A link inside a clickable row or card goes where the link says.
  if (ev.target.closest('a')) return;
  const t = ev.target.closest('button, [data-href], [data-mchamp]');
  if (!t) return;
  if (t.dataset.href) { location.hash = t.dataset.href; return; }
  if (t.dataset.tier) { state.tier = t.dataset.tier; loadLadder(); }
  if (t.dataset.queue) { state.queue = t.dataset.queue; loadLadder(); loadTop(); }
  if (t.dataset.page) { state.page += Number(t.dataset.page); renderLadder(); }
  if (t.dataset.mqueue) { pl.queue = Number(t.dataset.mqueue); loadMatches(viewSeq); loadPool(viewSeq); }
  if (t.dataset.mchamp) { pl.champion = Number(t.dataset.mchamp); loadMatches(viewSeq); loadPool(viewSeq); }
  if ('more' in t.dataset) { t.disabled = true; loadMatches(viewSeq, false, true); }
  if ('mastery' in t.dataset) { pl.masteryAll = !pl.masteryAll; renderMastery(); }
  if (t.dataset.cqueue) { state.queue = t.dataset.cqueue; route(); }
  if (t.dataset.role !== undefined) { ch.role = t.dataset.role; renderMatchups(); }
  if (t.dataset.build !== undefined) { ch.tab = Number(t.dataset.build); renderBuilds(); }
  if (t.dataset.bplayer) { mb.puuid = t.dataset.bplayer; renderBuild(); }
  if ('refresh' in t.dataset) { const { view, args } = parseRoute(location.hash); if (view === 'player') renderPlayer(args, true); }
});
// The analytics pickers (DEV-21): the patch is shared by the home and champion views.
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if ('patch' in t.dataset) { state.patch = t.value; if (parseRoute(location.hash).view === 'champion') route(); else loadTop(); }
  if ('region' in t.dataset) { state.region = t.value; route(); }
});
// An image the mirror cannot serve (an item retired since that game, say) becomes the
// same empty box, with a champion's initials where it has them.
document.addEventListener('error', (ev) => {
  const img = ev.target;
  if (img.tagName !== 'IMG') return;
  const box = document.createElement('span');
  box.className = img.className;
  box.textContent = img.dataset.short ?? '';
  img.replaceWith(box);
}, true);

$('#search').onsubmit = (ev) => {
  ev.preventDefault();
  const id = parseRiotId(ev.target.elements.id.value);
  if (!id) { ev.target.elements.id.setCustomValidity('Name#TAG'); ev.target.elements.id.reportValidity(); return; }
  location.hash = `#/player/${encodeURIComponent(id.gameName)}/${encodeURIComponent(id.tagLine)}`;
};
$('#search').elements.id.oninput = (ev) => ev.target.setCustomValidity('');

async function boot() {
  $('#key').value = store.get('rp.dev.key', '');
  $('#key').onchange = () => { store.set('rp.dev.key', $('#key').value.trim()); route(); };
  cfg = await fetch('/dev/config.json').then((r) => r.json());
  $('#key').hidden = cfg.authDisabled;
  const saved = store.get('rp.showcase.platform', '');
  $('#platform').innerHTML = `<option value="">platform…</option>${cfg.platforms.map((p) => `<option value="${esc(p.value)}" ${p.value === saved ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}`;
  $('#platform').onchange = () => { store.set('rp.showcase.platform', platform()); state.ladderFor = ''; state.region = null; route(); };
  const [v, c] = await Promise.all([get('/v1/static/versions'), get('/v1/static/champion')]);
  version = v.json?.current ?? null;
  $('#patch').textContent = version ? `patch ${version}` : 'no patch mirrored';
  if (c.ok) champions = championIndex(c.json);
  window.onhashchange = route;
  route();
}
boot();
</script>
</body>
</html>
