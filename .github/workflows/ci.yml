name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: proxy
          POSTGRES_PASSWORD: proxy
          POSTGRES_DB: riotproxy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proxy -d riotproxy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Never a real key — the suite only asserts on redaction and key-scope
      # derivation, and every upstream call is stubbed.
      RIOT_API_KEY: RGAPI-ci-placeholder-0000-0000-000000000000
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://proxy:proxy@localhost:5432/riotproxy
      NODE_ENV: test
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npm run migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
