name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: proxy
          POSTGRES_PASSWORD: proxy
          POSTGRES_DB: riotproxy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proxy -d riotproxy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Never a real key — the suite only asserts on redaction and key-scope
      # derivation, and every upstream call is stubbed.
      RIOT_API_KEY: RGAPI-ci-placeholder-0000-0000-000000000000
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://proxy:proxy@localhost:5432/riotproxy
      NODE_ENV: test
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v7

      # Read the version from .nvmrc so CI, the Dockerfile and a developer's shell
      # cannot drift apart silently.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npm run migrate

      - name: Test
        run: npm test

      # The suite must not depend on the machine it runs on. Every value here is
      # one a developer might plausibly keep in .env; all of them used to be
      # inherited verbatim, and STALE_WHILE_REVALIDATE used to turn a test red.
      # AUTH_DISABLED is the dangerous direction — it would make the auth
      # rejection tests pass without asserting anything.
      - name: Test (hostile environment)
        env:
          STALE_WHILE_REVALIDATE: 'false'
          AUTH_DISABLED: 'true'
          DEFAULT_PLATFORM: na1
          NEG_TTL_SECONDS: '999'
          BULK_USAGE_CEILING: '0.1'
          SF_LOCK_MS: '100'
          CLIENT_WAIT_BUDGET_MS: '0'
          ARCHIVE_TIMELINES: 'true'
          LOG_LEVEL: debug
          ADMIN_IP_ALLOWLIST: 10.0.0.1
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
