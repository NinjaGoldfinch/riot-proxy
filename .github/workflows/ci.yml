name: ci

on:
  push:
    branches: [main]
  pull_request: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Job ids are the required status checks on `main` (fmt, clippy, test, build-musl,
# acceptance) —
# renaming a job means updating branch protection too. See ADR-006.
# The toolchain, components and musl target all come from rust-toolchain.toml.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # P8-04: the Postgres store stub compiles on its own, and its tests pass.
      - run: cargo check --all-targets --features postgres
      - run: cargo test --lib --features postgres db::store

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup component add llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --workspace --summary-only
      - name: no leaked Riot keys
        run: '! grep -rE "RGAPI-[0-9a-f-]{20,}" tests/ src/ docs/'

  # v1's black-box acceptance suite against `serve` and a mock Riot (P8-01,
  # ADR-059). Mock mode only: no Riot key is involved.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: acceptance/package-lock.json
      - run: cargo build
      - run: npm ci --no-audit --no-fund
        working-directory: acceptance
      - run: npm test
        working-directory: acceptance

  build-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: static and under 20 MB
        run: |
          bin=target/x86_64-unknown-linux-musl/release/riot-proxy
          ls -la "$bin"
          file "$bin" | tee /dev/stderr | grep -qE "static(ally|-pie) linked"
          test "$(stat -c %s "$bin")" -lt $((20 * 1024 * 1024))
      - name: docker image builds
        run: docker build -t riot-proxy:ci .
      - name: image runs, serves, and passes its own healthcheck
        run: |
          docker run --rm riot-proxy:ci --version
          docker run -d --name rp -e RIOT_API_KEY=ci-dummy-key-not-a-riot-key -p 8080:8080 riot-proxy:ci
          for i in $(seq 1 30); do
            if docker exec rp /riot-proxy healthcheck; then break; fi
            sleep 1
          done
          docker exec rp /riot-proxy healthcheck
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/readyz
          docker logs rp 2>&1 | grep -q "bootstrap admin key (shown once)"
          docker stop -t 15 rp
          test "$(docker inspect -f '{{.State.ExitCode}}' rp)" = 0
          docker images riot-proxy:ci --format 'image size: {{.Size}}'
      - name: docker compose up serves /healthz
        run: |
          echo "RIOT_API_KEY=ci-dummy-key-not-a-riot-key" > .env
          docker compose up -d --build --wait --wait-timeout 60 || true
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/healthz
          docker compose down
      - if: failure()
        run: docker logs rp || true; docker compose logs || true
