name: release

# Plan P8-05 (design/07). A `v*` tag builds three static or native binaries,
# pushes the image to GHCR and publishes a GitHub release with the binaries,
# `sha256sums` and the image digest, plus the amd64 deploy tarball (DEP-02, ADR-195).
# The release waits for the Linux builds only; the macOS binary is attached when
# it is built (DEP-04, ADR-197). A tag with a pre-release suffix
# (`v2.0.0-rc.0`) makes a pre-release and does not move `:2`.
# A pull request that touches this file runs the builds and publishes nothing.
# See ADR-063. The image's description lists the commits since the previous
# `v*` tag, and the release notes list its pull requests (OPS-05, ADR-107).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile.release
      - scripts/image-description.sh
      - scripts/check-image-description.sh

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE: ghcr.io/ninjagoldfinch/riot-proxy
  # build.rs embeds it for GET /v1/admin/info (ADM-03).
  GIT_SHA: ${{ github.sha }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: riot-proxy-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: riot-proxy-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: the binary runs and reports the release version
        run: |
          bin=target/${{ matrix.target }}/release/riot-proxy
          file "$bin"
          "$bin" --version | tee /dev/stderr | grep -qx "riot-proxy ${{ needs.version.outputs.version }}"
          # The commit is embedded, not `unknown` (ADM-03).
          grep -qa "${GIT_SHA:0:12}" "$bin"
          mkdir dist && cp "$bin" dist/${{ matrix.asset }}
      - if: runner.os == 'Linux'
        name: static and under 24 MiB
        run: |
          bin=dist/${{ matrix.asset }}
          file "$bin" | grep -qE "static(ally|-pie) linked"
          test "$(stat -c %s "$bin")" -lt $((24 * 1024 * 1024))
      # DEP-02 (ADR-195): the form ninja-deploy uploads to a host. One top-level
      # directory with the binary and version.json; the release lists it in sha256sums.
      - if: matrix.asset == 'riot-proxy-linux-amd64'
        name: the deploy tarball holds the binary and version.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tgz=dist/riot-proxy-x86_64-linux.tar.gz
          mkdir -p pkg/riot-proxy
          cp dist/${{ matrix.asset }} pkg/riot-proxy/riot-proxy
          printf '{"version":"v%s","commit":"%s","built_at":"%s"}\n' \
            "$VERSION" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > pkg/riot-proxy/version.json
          tar -czf "$tgz" -C pkg riot-proxy
          test "$(tar -tzf "$tgz" | sort | tr '\n' ' ')" = "riot-proxy/ riot-proxy/riot-proxy riot-proxy/version.json "
          tar -xzOf "$tgz" riot-proxy/version.json | tee /dev/stderr | grep -q "\"version\":\"v$VERSION\""
          mkdir unpacked && tar -xzf "$tgz" -C unpacked
          unpacked/riot-proxy/riot-proxy --version | grep -qx "riot-proxy $VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
      - if: matrix.asset == 'riot-proxy-linux-amd64'
        uses: actions/upload-artifact@v7
        with:
          name: riot-proxy-x86_64-linux.tar.gz
          path: dist/riot-proxy-x86_64-linux.tar.gz
          if-no-files-found: error

  # DEP-04 (ADR-197): the macOS binary is not on the release's path. GitHub's
  # macOS arm64 runners can go unacquired for long enough to cancel the job
  # (v2.10.0's first run); the release publishes without it and `attach-darwin`
  # adds it, with its checksum, once it is built. Re-running this job after a
  # failure runs `attach-darwin` again too.
  build-darwin:
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: the binary runs and reports the release version
        run: |
          bin=target/aarch64-apple-darwin/release/riot-proxy
          file "$bin"
          "$bin" --version | tee /dev/stderr | grep -qx "riot-proxy ${{ needs.version.outputs.version }}"
          # The commit is embedded, not `unknown` (ADM-03).
          grep -qa "${GIT_SHA:0:12}" "$bin"
          mkdir dist && cp "$bin" dist/riot-proxy-darwin-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: riot-proxy-darwin-arm64
          path: dist/riot-proxy-darwin-arm64
          if-no-files-found: error

  image:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: riot-proxy-linux-*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/*
      - uses: docker/setup-buildx-action@v4
      - id: desc
        name: describe the image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          from=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          text=$(scripts/image-description.sh "riot-proxy $VERSION" "$GITHUB_SHA" "$from")
          echo "$text"
          echo "text=$text" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR reads a multi-arch image's description from the index (ADR-107).
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # {{major}} is skipped for pre-releases, so an rc never moves :2.
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }}
          labels: org.opencontainers.image.description=${{ steps.desc.outputs.text }}
          annotations: org.opencontainers.image.description=${{ steps.desc.outputs.text }}
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A pull request writes the image to an OCI tarball instead, so the check below runs there too.
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          outputs: ${{ github.event_name != 'push' && format('type=oci,dest={0}/image.tar', runner.temp) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: the image index carries the description
        env:
          WANT: ${{ steps.desc.outputs.text }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          src="$RUNNER_TEMP/image.tar"
          [ "$GITHUB_EVENT_NAME" = push ] && src="$IMAGE@$DIGEST"
          scripts/check-image-description.sh "$src" "$WANT"
      - name: the amd64 image serves and passes its own healthcheck
        run: |
          docker buildx build --load --platform linux/amd64 -f Dockerfile.release -t riot-proxy:release .
          docker run --rm riot-proxy:release --version
          docker run -d --name rp -e RIOT_API_KEY=ci-dummy-key-not-a-riot-key -p 8080:8080 riot-proxy:release
          for i in $(seq 1 30); do docker exec rp /riot-proxy healthcheck && break; sleep 1; done
          docker exec rp /riot-proxy healthcheck
          docker stop -t 15 rp

  release:
    if: github.event_name == 'push'
    needs: [version, build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the Linux binaries and the deploy tarball, by name: build-push-action
      # also uploads a `.dockerbuild` record, and the macOS binary comes later
      # (`attach-darwin`), whether or not it is already built (DEP-04).
      - uses: actions/download-artifact@v8
        with:
          pattern: riot-proxy-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: riot-proxy-x86_64-linux.tar.gz
          path: dist
      - run: cd dist && sha256sum riot-proxy-* > sha256sums && cat sha256sums
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<NOTES
          Image: \`$IMAGE:$VERSION\`
          Digest: \`$IMAGE@$DIGEST\`

          Binaries are static (Linux, musl) or native (macOS); check them against \`sha256sums\`.
          The macOS binary is attached once its build finishes, and \`sha256sums\` then lists it too.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag $prerelease

  # DEP-04 (ADR-197): adds the macOS binary to the published release and its line
  # to `sha256sums` (replacing an earlier one), so a late macOS build never holds
  # the release back.
  attach-darwin:
    if: github.event_name == 'push'
    needs: [build-darwin, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: riot-proxy-darwin-arm64
          path: dist
      - name: attach it and add it to sha256sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p sha256sums --clobber
          { grep -v ' riot-proxy-darwin-arm64$' sha256sums || true; sha256sum riot-proxy-darwin-arm64; } | sort -k2 > sums.new
          mv sums.new sha256sums && cat sha256sums
          sha256sum --strict -c --ignore-missing sha256sums
          gh release upload "$GITHUB_REF_NAME" riot-proxy-darwin-arm64 sha256sums --clobber --repo "$GITHUB_REPOSITORY"
