name: edge

# OPS-01 (ADR-069). Every push to `main` publishes the amd64 image as `:edge`
# and `:sha-<short>`, so a dev box can follow `main` by pulling (OPS-02).
# Release tags and `:2` stay with release.yml; `:edge` is never a release.
# A pull request that touches this file builds and smoke-tests, and pushes nothing.
on:
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/edge.yml", "Dockerfile.release"]

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE: ghcr.io/ninjagoldfinch/riot-proxy

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: the binary is static
        run: |
          mkdir dist && cp target/x86_64-unknown-linux-musl/release/riot-proxy dist/riot-proxy-linux-amd64
          file dist/riot-proxy-linux-amd64 | grep -qE "static(ally|-pie) linked"
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-
      - name: the image serves and passes its own healthcheck
        run: |
          docker buildx build --load --platform linux/amd64 -f Dockerfile.release -t riot-proxy:edge .
          docker run --rm riot-proxy:edge --version
          docker run -d --name rp -e RIOT_API_KEY=ci-dummy-key-not-a-riot-key -p 8080:8080 riot-proxy:edge
          for i in $(seq 1 30); do docker exec rp /riot-proxy healthcheck && break; sleep 1; done
          docker exec rp /riot-proxy healthcheck
          docker stop -t 15 rp
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
