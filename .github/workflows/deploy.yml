name: deploy

# DEP-03 (ADR-196). Deploys a release to production through the shared pipeline,
# NinjaGoldfinch/ninja-actions/deploy: it checks the release's deploy tarball
# against sha256sums, uploads it to /srv/riot-proxy/releases/ unless the host
# already has it, and activates it. The host restarts riot-proxy, waits for
# /readyz to report the new version and rolls back by itself if it does not.
# Rolling back on purpose is deploying the previous version: it is still on the
# host, so there is no upload. The prod environment waits for the owner's
# approval. Started by hand or with ngf-deploy (ninja-actions tools/).
on:
  workflow_dispatch:
    inputs:
      env:
        description: Where to deploy (staging comes later)
        type: choice
        options: [prod]
        default: prod
      version:
        description: Release tag, e.g. v2.10.0
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false

env:
  SERVICE: riot-proxy
  # Built and checked by release.yml (DEP-02, ADR-195).
  ASSET: riot-proxy-x86_64-linux.tar.gz
  CHECKSUMS: sha256sums

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.env }}
    runs-on: [self-hosted, linux, proxmox]
    environment: ${{ inputs.env }}
    # The host's health wait covers a migrating boot, and a rollback waits again.
    timeout-minutes: 30
    steps:
      - uses: NinjaGoldfinch/ninja-actions/deploy@v1
        with:
          service: ${{ env.SERVICE }}
          version: ${{ inputs.version }}
          asset: ${{ env.ASSET }}
          checksums: ${{ env.CHECKSUMS }}
          host: ${{ vars.DEPLOY_HOST }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
