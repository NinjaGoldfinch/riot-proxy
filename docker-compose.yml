name: riot-proxy

services:
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: proxy
      POSTGRES_DB: riotproxy
    ports:
      - '5432:5432'
    volumes:
      # PG 18+ images want the mount at /var/lib/postgresql (not .../data) so
      # pg_upgrade --link can work across major versions.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U proxy -d riotproxy']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  pg-data:
