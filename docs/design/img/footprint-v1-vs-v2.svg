<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#0f172a"/>
  <text x="450" y="34" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="600">Deployment footprint — v1 vs v2</text>

  <!-- v1 panel -->
  <rect x="30" y="60" width="400" height="330" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="230" y="86" text-anchor="middle" fill="#fca5a5" font-weight="600" font-size="15">v1 — 7 containers · 4 volumes</text>

  <g fill="#334155" stroke="#475569">
    <rect x="50" y="105" width="110" height="46" rx="8"/>
    <rect x="175" y="105" width="110" height="46" rx="8"/>
    <rect x="300" y="105" width="110" height="46" rx="8"/>
    <rect x="50" y="175" width="110" height="46" rx="8"/>
    <rect x="175" y="175" width="110" height="46" rx="8"/>
    <rect x="300" y="175" width="110" height="46" rx="8"/>
    <rect x="175" y="245" width="110" height="46" rx="8"/>
  </g>
  <g fill="#e2e8f0" text-anchor="middle">
    <text x="105" y="124">caddy</text><text x="105" y="141" fill="#94a3b8" font-size="11">TLS · static</text>
    <text x="230" y="124">api</text><text x="230" y="141" fill="#94a3b8" font-size="11">Node 26 · Fastify</text>
    <text x="355" y="124">worker</text><text x="355" y="141" fill="#94a3b8" font-size="11">Node 26 · BullMQ</text>
    <text x="105" y="194">redis</text><text x="105" y="211" fill="#94a3b8" font-size="11">cache · limiter · queue</text>
    <text x="230" y="194">postgres</text><text x="230" y="211" fill="#94a3b8" font-size="11">archive · analytics</text>
    <text x="355" y="194">pg-backup</text><text x="355" y="211" fill="#94a3b8" font-size="11">nightly pg_dump</text>
    <text x="230" y="264">migrate</text><text x="230" y="281" fill="#94a3b8" font-size="11">one-shot</text>
  </g>
  <g fill="#94a3b8" font-size="12">
    <text x="50" y="325">≈ 300 MB idle RSS</text>
    <text x="50" y="345">≈ 10 s cold start</text>
    <text x="50" y="365">3 runtime pins (Node, Redis, Postgres)</text>
    <text x="250" y="325">2 compose files + Caddyfile</text>
    <text x="250" y="345">16k lines TS</text>
    <text x="250" y="365">tests need live Redis + PG</text>
  </g>

  <!-- arrow -->
  <line x1="440" y1="225" x2="470" y2="225" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>

  <!-- v2 panel -->
  <rect x="480" y="60" width="390" height="330" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="675" y="86" text-anchor="middle" fill="#86efac" font-weight="600" font-size="15">v2 — 1 container · 1 volume</text>

  <rect x="530" y="110" width="290" height="140" rx="10" fill="#14532d" stroke="#22c55e"/>
  <text x="675" y="136" text-anchor="middle" fill="#f0fdf4" font-weight="600" font-size="14">riot-proxy</text>
  <text x="675" y="154" text-anchor="middle" fill="#bbf7d0" font-size="11">single static binary · ~12 MB</text>
  <g fill="#dcfce7" font-size="11" text-anchor="middle">
    <text x="600" y="185">HTTP + WS</text>
    <text x="675" y="185">limiter</text>
    <text x="750" y="185">cache</text>
    <text x="600" y="205">scheduler</text>
    <text x="675" y="205">jobs</text>
    <text x="750" y="205">archive</text>
    <text x="675" y="232">optional: --tls (ACME)  ·  --database postgres://</text>
  </g>

  <rect x="580" y="268" width="190" height="34" rx="8" fill="#334155" stroke="#475569"/>
  <text x="675" y="290" text-anchor="middle" fill="#e2e8f0">data/  ·  riot-proxy.db (SQLite)</text>

  <g fill="#94a3b8" font-size="12">
    <text x="500" y="325">≈ 20–40 MB idle RSS</text>
    <text x="500" y="345">&lt; 100 ms cold start</text>
    <text x="500" y="365">0 runtime pins</text>
    <text x="690" y="325">1 compose file (5 lines)</text>
    <text x="690" y="345">≈ 6–8k lines Rust</text>
    <text x="690" y="365">tests run in-process</text>
  </g>
</svg>
