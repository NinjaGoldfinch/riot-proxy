<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="600">v2 deployment topologies — same binary, same .env</text>

  <!-- A: docker -->
  <rect x="25" y="55" width="270" height="280" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="80" text-anchor="middle" fill="#93c5fd" font-weight="600" font-size="14">A · Docker, one service</text>
  <rect x="55" y="100" width="210" height="60" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="160" y="124" text-anchor="middle" fill="#dbeafe">riot-proxy:2  (FROM scratch)</text>
  <text x="160" y="144" text-anchor="middle" fill="#bfdbfe" font-size="11">ports 8080 · volumes ./data:/data</text>
  <rect x="85" y="185" width="150" height="34" rx="8" fill="#334155" stroke="#475569"/>
  <text x="160" y="207" text-anchor="middle" fill="#e2e8f0">./data (bind mount)</text>
  <line x1="160" y1="160" x2="160" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="260" text-anchor="middle" fill="#94a3b8">Put Caddy/Traefik in front if you</text>
  <text x="160" y="278" text-anchor="middle" fill="#94a3b8">already run one — or use B.</text>
  <text x="160" y="315" text-anchor="middle" fill="#64748b" font-size="11">docker compose up -d</text>

  <!-- B: builtin TLS -->
  <rect x="315" y="55" width="270" height="280" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="450" y="80" text-anchor="middle" fill="#c4b5fd" font-weight="600" font-size="14">B · Built-in TLS, no proxy</text>
  <rect x="345" y="100" width="210" height="60" rx="8" fill="#4c1d95" stroke="#8b5cf6"/>
  <text x="450" y="124" text-anchor="middle" fill="#ede9fe">riot-proxy serve --tls</text>
  <text x="450" y="144" text-anchor="middle" fill="#ddd6fe" font-size="11">rustls + ACME · :443 (+:80 redirect)</text>
  <rect x="375" y="185" width="150" height="34" rx="8" fill="#334155" stroke="#475569"/>
  <text x="450" y="207" text-anchor="middle" fill="#e2e8f0">data/acme · data/ddragon</text>
  <line x1="450" y1="160" x2="450" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="260" text-anchor="middle" fill="#94a3b8">Certificates renew themselves.</text>
  <text x="450" y="278" text-anchor="middle" fill="#94a3b8">/ddragon served static with</text>
  <text x="450" y="296" text-anchor="middle" fill="#94a3b8">immutable cache headers.</text>
  <text x="450" y="322" text-anchor="middle" fill="#64748b" font-size="11">Docker or systemd — either</text>

  <!-- C: systemd -->
  <rect x="605" y="55" width="270" height="280" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="740" y="80" text-anchor="middle" fill="#fdba74" font-weight="600" font-size="14">C · systemd, no containers</text>
  <rect x="635" y="100" width="210" height="60" rx="8" fill="#7c2d12" stroke="#f97316"/>
  <text x="740" y="124" text-anchor="middle" fill="#ffedd5">/usr/local/bin/riot-proxy</text>
  <text x="740" y="144" text-anchor="middle" fill="#fed7aa" font-size="11">riot-proxy.service · Restart=always</text>
  <rect x="665" y="185" width="150" height="34" rx="8" fill="#334155" stroke="#475569"/>
  <text x="740" y="207" text-anchor="middle" fill="#e2e8f0">/var/lib/riot-proxy</text>
  <line x1="740" y1="160" x2="740" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="740" y="260" text-anchor="middle" fill="#94a3b8">Pi / Hetzner / Oracle ARM.</text>
  <text x="740" y="278" text-anchor="middle" fill="#94a3b8">Upgrade = scp + restart.</text>
  <text x="740" y="296" text-anchor="middle" fill="#94a3b8">Hardened unit (ProtectSystem=strict).</text>
  <text x="740" y="322" text-anchor="middle" fill="#64748b" font-size="11">Smallest possible footprint</text>
</svg>
